    post:
      tags: [sites]
      operationId: createOutdoorArea
      summary: Create an outdoor area (A3)
      description: Requires `outdoor-area:create` on the site.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutdoorAreaInput'
      responses:
        '201':
          description: Outdoor area created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutdoorArea'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another outdoor area of the site has this name (`OUTDOOR_AREA_NAME_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/outdoor-areas/{outdoorAreaId}:
    parameters:
      - $ref: '#/components/parameters/OutdoorAreaId'
    put:
      tags: [sites]
      operationId: updateOutdoorArea
      summary: Update or archive an outdoor area
      description: |
        Requires `outdoor-area:update` on its site; setting `active` to `false` also requires `outdoor-area:archive`.
        Never deleted (M2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutdoorAreaRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
