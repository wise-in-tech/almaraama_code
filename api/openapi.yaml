                $ref: '#/components/schemas/AssetFamily'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another family visible to the organization has this code (`ASSET_FAMILY_CODE_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/asset-families:
    get:
      tags: [admin, assets]
      operationId: listPlatformAssetFamilies
      summary: Default equipment families of the platform (G1, M7)
      description: Requires `reference-data:read` on the platform.
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Families with their models.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AssetFamily'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [admin, assets]
      operationId: createPlatformAssetFamily
      summary: Add a default family offered to every organization (G1, M7)
      description: Requires `reference-data:create` on the platform.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetFamilyInput'
      responses:
        '201':
          description: Family created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetFamily'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          description: '`ASSET_FAMILY_CODE_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/asset-families/{familyId}:
    parameters:
      - $ref: '#/components/parameters/AssetFamilyId'
    put:
      tags: [assets]
      operationId: updateAssetFamily
      summary: Rename, reorder or archive a family
      description: |
        A platform family needs `reference-data:update` (and `reference-data:archive` to archive); an organization's
        family needs `asset:update` (and `asset:archive`) on the organization or one of its sites. The code cannot
        change. An archived family stays on its equipment but cannot be given to new equipment (M2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetFamilyRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetFamily'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/asset-families/{familyId}/models:
    parameters:
      - $ref: '#/components/parameters/AssetFamilyId'
    post:
      tags: [assets]
      operationId: createAssetModel
      summary: Add a model to a family (G1)
      description: |
        Same permissions as changing the family. An organization may add its own models to a platform family with
        `asset:create`: such a model is visible only to that organization.
      parameters:
        - name: organizationId
          in: query
          description: Required when an organization adds a model to a platform family.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetModelInput'
      responses:
        '201':
          description: Model created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetModel'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The family already has a model with this name and version (`ASSET_MODEL_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/asset-models/{modelId}:
    parameters:
      - $ref: '#/components/parameters/AssetModelId'
    put:
      tags: [assets]
      operationId: updateAssetModel
      summary: Rename or archive a model
      description: Same permissions as for its owner (platform or organization).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetModelRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetModel'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/asset-families/{familyId}/attributes:
    parameters:
      - $ref: '#/components/parameters/AssetFamilyId'
    get:
      tags: [assets]
      operationId: listAssetAttributeDefinitions
      summary: Characteristics defined for a family (G3, ADR-039)
      description: |
        Requires `asset:read` on the organization or one of its sites (or `reference-data:read` without
        `organizationId`). The platform's definitions, then the organization's. Used by the "Caractéristiques" block.
      parameters:
        - name: organizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Definitions by sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributeDefinition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [assets]
      operationId: createAssetAttributeDefinition
      summary: Define a characteristic for a family (G3, ADR-039)
      description: |
        Scope `PLATFORM` needs `reference-data:create`; scope `ORGANIZATION` needs `asset:update` on the
        organization or one of its sites. The code and the data type cannot change later.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeDefinitionInput'
      responses:
        '201':
          description: Definition created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The family already has a characteristic with this code (`ATTRIBUTE_CODE_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/attribute-definitions/{definitionId}:
    parameters:
      - $ref: '#/components/parameters/AttributeDefinitionId'
    put:
      tags: [assets]
      operationId: updateAttributeDefinition
      summary: Change the labels, options, order or state of a characteristic
      description: |
        Same permissions as for its scope. Archiving keeps the values already stored but hides the field. A list
        option already used cannot be removed, only archived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttributeDefinitionRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeDefinition'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/organizations/{organizationId}/suppliers:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [assets]
      operationId: listSuppliers
      summary: Supplier contacts of an organization (G3)
      description: Requires `asset:update` on the organization or one of its sites (management view, ADR-039).
      parameters:
        - name: q
          in: query
          description: Part of the name or the activity.
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Suppliers by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Supplier'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [assets]
      operationId: createSupplier
      summary: Add a reusable supplier contact (G3)
      description: Requires `asset:create` on the organization or one of its sites.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInput'
      responses:
        '201':
          description: Supplier created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/PhoneRejected'

  /v1/suppliers/{supplierId}:
    parameters:
      - $ref: '#/components/parameters/SupplierId'
    put:
      tags: [assets]
      operationId: updateSupplier
      summary: Change or deactivate a supplier contact
      description: Requires `asset:update` on the organization or one of its sites. Never deleted (M2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/PhoneRejected'

  /v1/sites/{siteId}/assets:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [assets]
      operationId: listAssets
      summary: Equipment of a site (G2, C4)
      description: |
        Requires `asset:read` on the site. Residents see the resident view; with `asset:update` each item also
        carries its QR code (for printing labels). Restricted residents see the equipment of their buildings and of
        the common areas (C7).
      parameters:
        - name: buildingId
          in: query
          schema:
            type: string
            format: uuid
        - name: outdoorAreaId
          in: query
          schema:
            type: string
            format: uuid
        - name: familyId
          in: query
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/AssetState'
        - name: q
          in: query
          description: Part of the name or the reference.
          schema:
            type: string
            maxLength: 100
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of equipment, by family then reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [assets]
      operationId: createAsset
      summary: Add an equipment to a site (G1 to G4)
      description: |
        Requires `asset:create` on the site. The family must be usable by the organization and active; the model,
        when given, must belong to the family; the location must be in the site. The reference is generated when
        absent. A QR code is created (G4). Characteristics are checked against the family's definitions.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetInput'
      responses:
        '201':
          description: Equipment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another equipment of the site has this reference (`ASSET_REFERENCE_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/AssetRuleViolated'

  /v1/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [assets]
      operationId: getAsset
      summary: An equipment (G3)
      description: |
        Requires `asset:read` on its site. `management` (supplier, documents with signed links, warranties,
        characteristics, QR code) is present only with `asset:update` (ADR-039).
      responses:
        '200':
          description: The equipment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [assets]
      operationId: updateAsset
      summary: Change an equipment
      description: |
        Requires `asset:update` on its site. Same checks as the creation. The family cannot change; the site cannot
        change. Archiving is a separate endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssetRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/AssetRuleViolated'

  /v1/assets/{assetId}/archive:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [assets]
      operationId: archiveAsset
      summary: Archive an equipment (M2)
      description: |
        Requires `asset:archive` on its site. The equipment stays in the history of its tickets; its QR code stops
        answering; no new ticket can name it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionOnly'
      responses:
        '200':
          description: Archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/assets/{assetId}/qr-code/rotate:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [assets]
      operationId: rotateAssetQrCode
      summary: Replace the QR code of an equipment (damaged or stolen label, G4)
      description: Requires `asset:update` on its site. The old code stops answering at once.
      responses:
        '200':
          description: New code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/assets/{assetId}/documents:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [assets]
      operationId: addAssetDocument
      summary: Attach a document to an equipment (G3)
      description: |
        Requires `asset:update` on its site. `fileId` comes from `POST /v1/files` with purpose `ASSET_DOCUMENT`,
        uploaded by the caller (`FILE_NOT_USABLE` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetDocumentInput'
      responses:
        '201':
          description: Attached. The whole equipment is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/FileNotUsable'

  /v1/assets/{assetId}/documents/{documentId}/archive:
    parameters:
      - $ref: '#/components/parameters/AssetId'
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [assets]
      operationId: archiveAssetDocument
      summary: Hide a document of an equipment (M2)
      description: Requires `asset:update` on its site. The file is kept.
      responses:
        '200':
          description: Archived. The whole equipment is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/assets/{assetId}/warranties:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    post:
      tags: [assets]
      operationId: addWarranty
      summary: Record a warranty of an equipment (G3)
      description: |
        Requires `asset:update` on its site. The end date must not be before the start date. The alert before
        expiry is sent from sprint 4 (K4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarrantyInput'
      responses:
        '201':
          description: Recorded. The whole equipment is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/AssetRuleViolated'

  /v1/assets/{assetId}/warranties/{warrantyId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
      - $ref: '#/components/parameters/WarrantyId'
    put:
      tags: [assets]
      operationId: updateWarranty
      summary: Correct or archive a warranty
      description: Requires `asset:update` on its site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWarrantyRequest'
      responses:
        '200':
          description: Updated. The whole equipment is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/AssetRuleViolated'

  /v1/asset-qr/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Z2-7]{26}$'
    get:
      tags: [assets]
      operationId: resolveAssetQrCode
      summary: The equipment behind a QR code label, to open the prefilled ticket form (G4, criterion 8)
      description: |
        Requires a session and `asset:read` on the equipment's site. An unknown code, a replaced code, an archived
        equipment and an equipment outside the perimeter all give the same `404`.
      responses:
        '200':
          description: The equipment (resident view).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/sites/{siteId}/assets/import:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      tags: [assets]
      operationId: importAssets
      summary: Import equipment from an Excel file (G1, G2, ADR-027 revision 3)
      description: |
        Requires `asset:create` on the site. Same file rules as the unit import (`.xlsx` from the template, 2 MB,
        2,000 rows, type checked by content, never stored, all or nothing, `dryRun`). Families are matched by code,
        models by name in the family, buildings, outdoor areas and suppliers by name; they must exist. Each equipment
        gets its QR code.
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The file was read. `outcome` says whether equipment was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetImportReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: More than 2 MB or 2,000 rows (`IMPORT_FILE_TOO_LARGE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Not an `.xlsx` file, or not built from the template (`IMPORT_FILE_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/assets/import-template:
    get:
      tags: [assets]
      operationId: downloadAssetImportTemplate
      summary: Excel template for the equipment import (ADR-027 revision 3)
      description: |
        Requires `asset:create` on at least one site. Headers and help in the requested language; families, states,
        and (with `siteId`) the site's buildings, outdoor areas and the organization's suppliers offered as lists.
      parameters:
        - name: language
          in: query
          schema:
            $ref: '#/components/schemas/Language'
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The template.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  # =====================================================================================================
  # Sprint 3: issue categories and types, routing and visibility (H2, H3, H4, H8, ADR-037)
  # =====================================================================================================

  /v1/sites/{siteId}/issue-catalog:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [tickets]
      operationId: getIssueCatalog
      summary: What a person can report on this site, by category then type (H2, criterion 8)
      description: |
        Requires `issue-type:read` on the site. Only active categories and types, with the visibility that applies
        on this site (H8). With `assetId`, only the types that fit the equipment's family. No routing details.
      parameters:
        - name: assetId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Categories with their types, by sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueCatalogCategory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/organizations/{organizationId}/issue-categories:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [tickets]
      operationId: listIssueCategories
      summary: Issue categories and types usable by an organization, for management (H2, M7)
      description: |
        Requires `issue-type:manage` on the organization or one of its sites. Platform defaults, then the
        organization's own, with their types.
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Categories with their types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueCategory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [tickets]
      operationId: createIssueCategory
      summary: Add an issue category for the organization (M7)
      description: Requires `issue-type:manage` on the organization or one of its sites.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCategoryInput'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ISSUE_CATEGORY_CODE_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/issue-categories:
    get:
      tags: [admin, tickets]
      operationId: listPlatformIssueCategories
      summary: Default issue categories and types of the platform (H2, M7)
      description: Requires `reference-data:read` on the platform.
      parameters:
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Categories with their types.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueCategory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [admin, tickets]
      operationId: createPlatformIssueCategory
      summary: Add a default issue category (M7)
      description: Requires `reference-data:create` on the platform.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCategoryInput'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          description: '`ISSUE_CATEGORY_CODE_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/issue-categories/{issueCategoryId}:
    parameters:
      - $ref: '#/components/parameters/IssueCategoryId'
    put:
      tags: [tickets]
      operationId: updateIssueCategory
      summary: Rename, reorder or archive an issue category
      description: |
        A platform category needs `reference-data:update` (`reference-data:archive` to archive); an organization's
        category needs `issue-type:manage` on the organization or one of its sites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueCategoryRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/issue-categories/{issueCategoryId}/types:
    parameters:
      - $ref: '#/components/parameters/IssueCategoryId'
    post:
      tags: [tickets]
      operationId: createIssueType
      summary: Add an issue type to a category (H2, H3, H8)
      description: |
        Same permissions as changing the category. An organization may add its own types to a platform category
        with `organizationId`: such a type is visible only to that organization.
      parameters:
        - name: organizationId
          in: query
          description: Required when an organization adds a type to a platform category.
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTypeInput'
      responses:
        '201':
          description: Type created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueType'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ISSUE_TYPE_CODE_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/issue-types/{issueTypeId}:
    parameters:
      - $ref: '#/components/parameters/IssueTypeId'
    put:
      tags: [tickets]
      operationId: updateIssueType
      summary: Change an issue type (labels, equipment required, default visibility, families, order, state)
      description: Same permissions as for its owner. The code and the category cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueTypeRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueType'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/sites/{siteId}/issue-type-configs:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [tickets]
      operationId: listIssueTypeConfigs
      summary: Routing and visibility of every issue type on a site (H4, H8)
      description: |
        Requires `issue-type:manage` on the site. One entry per active type usable by the organization; an entry
        without `configured` uses the defaults (manager, type's visibility).
      responses:
        '200':
          description: One entry per type, by category then type order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IssueTypeConfig'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/sites/{siteId}/issue-type-configs/{issueTypeId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/IssueTypeId'
    put:
      tags: [tickets]
      operationId: setIssueTypeConfig
      summary: Set where tickets of a type go on this site and who sees them (H4, H8)
      description: |
        Requires `issue-type:manage` on the site. With `TECHNICIANS`, one to five designated people who can act on
        tickets of the site (`ticket:update-status` there; `TECHNICIAN_NOT_ELIGIBLE` otherwise). Audited. New
        tickets only: existing tickets keep their visibility and assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueTypeConfigInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueTypeConfig'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: '`TECHNICIAN_NOT_ELIGIBLE` (with the person ids in `details`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}/eligible-technicians:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [tickets]
      operationId: listEligibleTechnicians
      summary: People who can be designated for routing on this site (H4)
      description: |
        Requires `issue-type:manage` on the site. People with an active role on the site or its organization that
        gives them `ticket:update-status` here, the managers included. The technician directory itself is sprint 4.
      responses:
        '200':
          description: People by last name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonRef'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  # =====================================================================================================
  # Sprint 3: tickets (H1 to H10, ADR-036, ADR-037)
  # =====================================================================================================

  /v1/tickets:
    get:
      tags: [tickets]
      operationId: listTickets
      summary: Tickets the caller can see (H8, C3, C4, M3, criteria 10 and 13)
      description: |
        Visibility (ADR-037): the caller's own tickets, the private tickets of the units they occupy, the common
        tickets of the sites where they are a member (their buildings only, C7), the tickets they are assigned to,
        and everything that `ticket:read` (common) and `ticket:read-private` (private) give on a scope. `view`
        narrows it: `MINE` (asked by me), `COMMON` (common parts), `ALL` (everything I can see). Newest change first.
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: view
          in: query
          schema:
            type: string
            enum: [ALL, MINE, COMMON]
            default: ALL
        - name: category
          in: query
          description: Status categories (fixed for every circuit). Several values allowed.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/NodeCategory'
        - name: issueTypeId
          in: query
          schema:
            type: string
            format: uuid
        - name: buildingId
          in: query
          schema:
            type: string
            format: uuid
        - name: assetId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Ticket reference, for example `T-000123`.
          schema:
            type: string
            maxLength: 20
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of tickets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [tickets]
      operationId: createTicket
      summary: Report a problem (H1 to H4, H10, G4, criteria 8 and 9)
      description: |
        Requires `ticket:create` on the site. The requester is the caller. With `assetId`, the location is copied
        from the equipment (G2). A unit must be occupied by the caller unless they have `unit:read` on the site; a
        building must be allowed (C7). The equipment is mandatory when the type requires it (H3). Visibility comes
        from the type and the site's setting (H8). At most three photos (H10), uploaded first with purpose
        `TICKET_PHOTO`. The ticket starts in the organization's circuit (ADR-036) and is routed by its type (H4):
        the managers, or the designated technicians, are notified (K1).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketInput'
      responses:
        '201':
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/TicketRuleViolated'

  /v1/tickets/{ticketId}:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [tickets]
      operationId: getTicket
      summary: A ticket (H8, H9)
      description: |
        Same visibility as the list; otherwise `404`. A reader who sees the ticket only as a common ticket of their
        residence gets the minimized view: no requester name, no photos (ADR-037).
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tickets/{ticketId}/transitions:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [tickets]
      operationId: listTicketTransitions
      summary: What the caller can do now on this ticket (H5, H6, H7, ADR-036)
      description: |
        The passages of the ticket's circuit from its current step that the caller may take: they hold the
        passage's permission on the site, or the passage is for the requester and the caller is the requester, and
        the options of the organization allow it. A common ticket seen only as a member gives an empty list (read
        only, H8). The server checks everything again when the passage is taken.
      responses:
        '200':
          description: Available passages, in the circuit's order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableTransition'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [tickets]
      operationId: fireTicketTransition
      summary: Change the step of a ticket (H5, H6, H7, C6)
      description: |
        Takes one passage of the circuit. Checks, in order: visibility (`404`), the passage exists from the current
        step and is open to the caller (`TRANSITION_NOT_AVAILABLE`), C6 (nobody closes a ticket they asked for:
        `SELF_CLOSE_FORBIDDEN`), then the passage's conditions (`REASON_REQUIRED`, `COMMENT_REQUIRED`,
        `REQUESTER_CONFIRMATION_REQUIRED`). The history keeps who, when, the reason and the comment (H9). The
        requester, the managers and the assigned technicians are notified, except the author (K1, K3).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        '200':
          description: The ticket after the passage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The ticket changed in the meantime (`VERSION_CONFLICT`), or the passage is not available from its current
            step or to the caller (`TRANSITION_NOT_AVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `SELF_CLOSE_FORBIDDEN` (C6), `REASON_REQUIRED`, `COMMENT_REQUIRED`, `REQUESTER_CONFIRMATION_REQUIRED`
            (H5 option).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/tickets/{ticketId}/history:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    get:
      tags: [tickets]
      operationId: getTicketHistory
      summary: Everything that happened to a ticket (H9)
      description: |
        Same visibility as the ticket. Steps of the circuit and other changes, oldest first; nothing is ever
        changed or removed. In the minimized view, people are shown by their part only (requester, manager,
        technician, system).
      responses:
        '200':
          description: History entries, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tickets/{ticketId}/photos:
    parameters:
      - $ref: '#/components/parameters/TicketId'
    post:
      tags: [tickets]
      operationId: addTicketPhoto
      summary: Add a photo to a ticket (H10)
      description: |
        The requester, or a person with `ticket:update-status` who sees the ticket, while it is neither closed nor
        cancelled. Three photos at most per ticket (`TICKET_PHOTO_LIMIT`). The file comes from `POST /v1/files`
        with purpose `TICKET_PHOTO`, uploaded by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId]
              properties:
                fileId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: The ticket with its photos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`TICKET_PHOTO_LIMIT`, `FILE_NOT_USABLE`, or the ticket is closed or cancelled (`TICKET_CLOSED`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # =====================================================================================================
  # Sprint 3: ticket circuit per client (H5, C12, section 3.5, ADR-036)
  # =====================================================================================================

  /v1/admin/workflows:
    get:
      tags: [admin, workflow]
      operationId: listWorkflows
      summary: Ticket circuits and their versions (ADR-036)
      description: Requires `ticket-workflow:read` on the platform.
      responses:
        '200':
          description: Circuits, the platform default first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/admin/workflows/{workflowId}/versions/{versionNumber}:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/VersionNumber'
    get:
      tags: [admin, workflow]
      operationId: getWorkflowVersion
      summary: Steps and passages of one version of a circuit (ADR-036)
      description: Requires `ticket-workflow:read` on the platform.
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/workflows/{workflowId}/versions/{versionNumber}/publish:
    parameters:
      - $ref: '#/components/parameters/WorkflowId'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      tags: [admin, workflow]
      operationId: publishWorkflowVersion
      summary: Publish a draft version loaded by the architect (ADR-036)
      description: |
        Requires `ticket-workflow:configure` on the platform. Checks the version first: one start step of category
        `OPEN`, at least one `CLOSED` and one `CANCELLED` step, every step reachable, known conditions and
        permissions, valid settings. The previous published version is retired; tickets already started finish on
        their own version. Audited.
      responses:
        '200':
          description: Published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowVersionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The version is not a draft (`WORKFLOW_VERSION_PUBLISHED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`WORKFLOW_DEFINITION_INVALID`, each problem in `violations`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/organizations/{organizationId}/workflow:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [admin, workflow]
      operationId: getOrganizationWorkflow
      summary: The ticket circuit of a client and its options (H5, criterion 19)
      description: |
        Requires `ticket-workflow:read` on the platform. Without a choice, the platform default without options.
      responses:
        '200':
          description: The client's circuit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationWorkflow'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [admin, workflow]
      operationId: setOrganizationWorkflow
      summary: Choose the circuit of a client and set its options (H5, criterion 19)
      description: |
        Requires `ticket-workflow:configure` on the platform. A new circuit applies to new tickets; the options
        (auto-close, requester validation, labels) apply at once, to open tickets too (ADR-036). Audited with the
        values before and after.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationWorkflowInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationWorkflow'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: |
            The circuit has no published version, is not a ticket circuit, or a label names an unknown step
            (`WORKFLOW_SETTINGS_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token issued by the identity module (ADR-004).

  parameters:
    CsrfHeader:
      name: X-Almaraama-Csrf
      in: header
      required: true
      description: Must be `1`. Protects the endpoints that read the refresh cookie against cross-site requests.
      schema:
        type: string
        const: '1'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-chosen key (a UUID). Sending the same request again with the same key returns the first answer
        without creating anything twice (IN-2), for retries on a poor mobile network.
      schema:
        type: string
        minLength: 8
        maxLength: 100
    Page:
      name: page
      in: query
      description: Page number, from 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IncludeInactive:
      name: includeInactive
      in: query
      schema:
        type: boolean
        default: false
    CountryCode:
      name: countryCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CountryCode'
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: siteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BuildingId:
      name: buildingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutdoorAreaId:
      name: outdoorAreaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleCodePath:
      name: roleCode
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RoleCode'
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ZoneId:
      name: zoneId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PreRegistrationId:
      name: preRegistrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupportSessionId:
      name: supportSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TextKey:
      name: key
      in: path
      required: true
      description: Dictionary key, for example `auth.login.title`.
      schema:
        type: string
        pattern: '^[a-z0-9]+([._-][a-zA-Z0-9]+)*$'
        maxLength: 150
    LanguagePath:
      name: language
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Language'
    AltchaHeader:
      name: X-Altcha
      in: header
      required: true
      description: |
        Solution of a challenge from `GET /v1/altcha/challenge`, as produced by the ALTCHA widget (base64 JSON).
        Valid once, within 10 minutes (ADR-032).
      schema:
        type: string
        maxLength: 2000

    # ---- Sprint 3 ----
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetFamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttributeDefinitionId:
      name: definitionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WarrantyId:
      name: warrantyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueCategoryId:
      name: issueCategoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IssueTypeId:
      name: issueTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
    RefreshCookie:
      description: >-
        `almaraama_refresh` cookie: HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth. Never readable by
        JavaScript.
      schema:
        type: string

  responses:
    SessionOpened:
      description: Session opened. The refresh cookie is set; the access token is in the body.
      headers:
        Set-Cookie:
          $ref: '#/components/headers/RefreshCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Session'
    LinkInvalid:
      description: Unknown, expired or already used link (`LINK_INVALID_OR_EXPIRED`, ADR-030).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PasswordRejected:
      description: |
        The password does not follow the rules (ADR-030): `PASSWORD_TOO_SHORT`, `PASSWORD_TOO_LONG`,
        `PASSWORD_TOO_COMMON`, `PASSWORD_SAME_AS_EMAIL`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AddressRejected:
      description: |
        `ZONE_NOT_ATTACHMENT_LEVEL` (A8: an address is attached to a zone of the attachment level, a commune for
        Algeria), `ZONE_OUTSIDE_ORGANIZATION_COUNTRY`, `ZONE_DEACTIVATED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: The request does not match the contract (`VALIDATION_FAILED`, with `violations`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Missing or expired access token (`UNAUTHENTICATED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfHeaderMissing:
      description: The `X-Almaraama-Csrf` header is missing (`CSRF_HEADER_MISSING`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests from this client (`RATE_LIMITED`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        Does not exist, or is outside the caller's perimeter (`NOT_FOUND`). Both cases give the same answer, so
        nothing reveals that another organization's data exists (M3, D5).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PermissionDenied:
      description: |
        The resource is in the caller's perimeter but they lack the permission for this action
        (`PERMISSION_DENIED`, ADR-026).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionConflict:
      description: Someone changed this object in the meantime (`VERSION_CONFLICT`). Reload and try again.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RegistrationCodeInvalid:
      description: |
        Unknown registration code, replaced, or deactivated by the promoteur (`REGISTRATION_CODE_INVALID`). The same
        answer in every case (ADR-034).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvitationCreated:
      description: Account invited (link sent by e-mail), or roles applied to an existing account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationResult'
    UnitReferenceTaken:
      description: Another unit of the site has this reference (`UNIT_REFERENCE_TAKEN`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnitRuleViolated:
      description: |
        `UNIT_LOCATION_INVALID` (A6: in a building or an outdoor area, never both), `UNIT_FLOOR_INVALID` (a floor
        only inside a building, within its floor count), `UNIT_ANNEX_INVALID` (A7: only a `PARKING` or `STORAGE`
        can be the annex of an `APARTMENT` of the same site), `UNIT_CATEGORY_TYPE_MISMATCH` (the category is for
        another unit type), `UNIT_CATEGORY_ARCHIVED`, `UNIT_CATEGORY_NOT_IN_SCOPE` (another organization's or
        site's category), `BUILDING_NOT_IN_SITE`, `OUTDOOR_AREA_NOT_IN_SITE`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    # ---- Sprint 3 ----
    PhoneRejected:
      description: The phone number is not a valid mobile of its country (`PHONE_INVALID`, ADR-028).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    FileNotUsable:
      description: |
        The file was uploaded by someone else, is already used, is older than 24 hours or has another purpose
        (`FILE_NOT_USABLE`, ADR-038).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AssetRuleViolated:
      description: |
        `ASSET_FAMILY_ARCHIVED`, `ASSET_FAMILY_NOT_IN_SCOPE` (another organization's family),
        `ASSET_MODEL_FAMILY_MISMATCH`, `ASSET_MODEL_ARCHIVED`, `BUILDING_NOT_IN_SITE`, `OUTDOOR_AREA_NOT_IN_SITE`,
        `ASSET_LOCATION_INVALID` (a building or an outdoor area, never both; a floor only inside a building),
        `ASSET_ARCHIVED`, `SUPPLIER_NOT_IN_ORGANIZATION`, `ATTRIBUTE_INVALID` (field codes in `violations`),
        `WARRANTY_DATES_INVALID`, `FILE_NOT_USABLE`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TicketRuleViolated:
      description: |
        `TICKET_ASSET_REQUIRED` (H3), `ASSET_ARCHIVED`, `ASSET_NOT_IN_SITE`, `TICKET_UNIT_NOT_OCCUPIED`,
        `BUILDING_NOT_ALLOWED` (C7), `BUILDING_NOT_IN_SITE`, `OUTDOOR_AREA_NOT_IN_SITE`, `UNIT_NOT_IN_SITE`,
        `TICKET_LOCATION_INVALID`, `ISSUE_TYPE_ARCHIVED`, `ISSUE_TYPE_NOT_IN_SCOPE`, `TICKET_PHOTO_LIMIT` (H10),
        `FILE_NOT_USABLE`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    LinkTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 100
          description: |
            Secret part of an account link (after `#`), ADR-030. Sent in the body, never in a URL path.

    InvitationPreview:
      type: object
      required: [firstName, email, language]
      properties:
        firstName:
          type: string
        email:
          type: string
          format: email
          description: The account being created, so the person knows which address will sign in.
        language:
          $ref: '#/components/schemas/Language'

    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 100
        password:
          $ref: '#/components/schemas/Password'
        deviceName:
          $ref: '#/components/schemas/DeviceName'

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 20
          maxLength: 100
        password:
          $ref: '#/components/schemas/Password'

    EmailRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: Checked against the stored hash only; the strength rules apply when a password is chosen.
          writeOnly: true
        deviceName:
          $ref: '#/components/schemas/DeviceName'

    Email:
      type: string
      format: email
      maxLength: 254
      description: |
        Sign-in identifier (D1). Compared after trimming and lower-casing; unique on the platform.
      example: amina.benali@example.dz

    Password:
      type: string
      minLength: 8
      maxLength: 128
      writeOnly: true
      description: |
        Chosen by the person (D5, ADR-030): 8 to 128 characters, any printable Unicode character and spaces, no
        composition rule. Refused when it is among the most common passwords (`PASSWORD_TOO_COMMON`) or equal to the
        e-mail or its part before `@` (`PASSWORD_SAME_AS_EMAIL`). Never stored, returned or logged.

    DeviceName:
      type: string
      maxLength: 120
      description: Shown to the person in their list of devices, for example the browser name.

    Session:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT to send as `Authorization Bearer`. Keep it in memory only.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Lifetime of the access token, in seconds.

    AltchaChallenge:
      type: object
      description: ALTCHA challenge (ADR-032), passed as is to the widget.
      required: [algorithm, challenge, maxnumber, salt, signature]
      properties:
        algorithm:
          type: string
          const: SHA-256
        challenge:
          type: string
        maxnumber:
          type: integer
        salt:
          type: string
          description: Carries the expiry (`?expires=`), signed with the challenge.
        signature:
          type: string

    Me:
      type: object
      required: [id, firstName, lastName, email, phone, language, status]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        emailVerifiedAt:
          type: string
          format: date-time
        phone:
          type: string
          description: E.164 (ADR-028). Mandatory, not an identifier.
          example: '+213661234567'
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/AccountStatus'

    Language:
      type: string
      description: Interface language (M1), in display order (Arabic, English, French). Glossary `Language`.
      enum: [AR, EN, FR]

    AccountStatus:
      type: string
      description: |
        `INVITED`: created by a manager, password to choose (D4). `PENDING_VERIFICATION`: password chosen, e-mail
        not verified yet (self-registration, sprint 2). `ACTIVE`: can sign in. `DEACTIVATED`: never deleted (D7).
        Glossary `AccountStatus`.
      enum: [INVITED, PENDING_VERIFICATION, ACTIVE, DEACTIVATED]

    Problem:
      description: |
        Error response (RFC 9457). Never contains a stack trace or an internal ID (security baseline).
        `code` is a stable English error code that the frontend translates.
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Business rule violated
        status:
          type: integer
          format: int32
          example: 422
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          example: OCCUPANCY_OWNER_EXISTS
        requestId:
          type: string
          maxLength: 64
          description: Same value as the `X-Request-Id` header, to find the request in the logs (ADR-033).
          example: 01HZX3K8Q9V2M4N6P7R8S9T0UV
        retryAfterSeconds:
          type: integer
          description: Present with `AUTH_TEMPORARILY_LOCKED` and `RATE_LIMITED`.
        violations:
          type: array
          description: Field-level validation errors (Bean Validation).
          items:
            $ref: '#/components/schemas/Violation'

    Violation:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          example: password
        code:
          type: string
          example: Size

    LocalizedText:
      description: Text shown to users, in every supported language.
      type: object
      required: [ar, en, fr]
      properties:
        ar:
          type: string
        en:
          type: string
        fr:
          type: string

    # ---- Sprint 1: shared shapes ----

    Version:
      type: integer
      format: int64
      minimum: 0
      description: Optimistic lock. Send back the value you read; a stale value gives `VERSION_CONFLICT`.

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    PhoneInput:
      type: string
      maxLength: 30
      description: |
        Mobile number of any country (D1, ADR-028). International form (`+33 6 12 34 56 78`, `0033…`) or the national
        form of Algeria, the default country (`0661 23 45 67`). Answered in E.164 (`+213661234567`). A number that
        is not a valid mobile of its country gives `PHONE_INVALID`.
      example: '+213 661 23 45 67'

    PersonRef:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string

    LocalizedTextInput:
      description: |
        Text typed by a promoteur or a manager, in one or more languages. A missing language falls back to the
        organization's language, then Arabic (M6).
      type: object
      minProperties: 1
      properties:
        ar:
          type: string
          minLength: 1
          maxLength: 100
        en:
          type: string
          minLength: 1
          maxLength: 100
        fr:
          type: string
          minLength: 1
          maxLength: 100

    PersonInput:
      type: object
      required: [firstName, lastName, email, phone, language]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/PhoneInput'
        language:
          $ref: '#/components/schemas/Language'

    ReasonRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500

    # ---- Reference data: countries and zones (A8) ----

    CountryCode:
      type: string
      pattern: '^[A-Z]{2}$'
      description: ISO 3166-1 alpha-2. `DZ` at launch.
      example: DZ

    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO 4217 (M5).
      example: DZD

    Country:
      type: object
      description: A country is a set of parameters (A8). Glossary `Country`.
      required: [code, name, levels, attachmentLevel, currencyCode, timeZone, languages, callingCode, workingDays]
      properties:
        code:
          $ref: '#/components/schemas/CountryCode'
        name:
          $ref: '#/components/schemas/LocalizedText'
        levels:
          type: array
          description: Named administrative levels, from 1 (top) to at most 4. Algeria - 1 wilaya, 2 commune.
          minItems: 1
          maxItems: 4
          items:
            type: object
            required: [level, name]
            properties:
              level:
                type: integer
                minimum: 1
                maximum: 4
              name:
                $ref: '#/components/schemas/LocalizedText'
        attachmentLevel:
          type: integer
          minimum: 1
          maximum: 4
          description: The level an address is attached to (the "city"). Algeria - 2 (commune).
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          type: string
          description: IANA time zone.
          example: Africa/Algiers
        languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
        callingCode:
          type: string
          pattern: '^\+[0-9]{1,4}$'
          example: '+213'
        workingDays:
          type: array
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
          example: [SUN, MON, TUE, WED, THU]

    ZoneStatus:
      type: string
      description: |
        `VALIDATED`: from the reference data. `PROVISIONAL`: created by a promoteur, waiting for the platform
        administrators. `DEACTIVATED`: kept, never deleted (M2), no longer offered. Glossary `ZoneStatus`.
      enum: [VALIDATED, PROVISIONAL, DEACTIVATED]

    ZoneRef:
      type: object
      required: [id, level, code, name]
      properties:
        id:
          type: string
          format: uuid
        level:
          type: integer
        code:
          type: string
          example: '16'
        name:
          $ref: '#/components/schemas/LocalizedText'

    Zone:
      description: A node of the single zone tree (A8). Glossary `Zone`.
      allOf:
        - $ref: '#/components/schemas/ZoneRef'
        - type: object
          required: [countryCode, status, ancestors]
          properties:
            countryCode:
              $ref: '#/components/schemas/CountryCode'
            parentId:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/ZoneStatus'
            ancestors:
              type: array
              description: From level 1 down to the parent (for a commune - its wilaya). Empty at level 1.
              items:
                $ref: '#/components/schemas/ZoneRef'

    ZonePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
        page:
          $ref: '#/components/schemas/PageMeta'

    ProvisionalZoneRequest:
      type: object
      required: [organizationId, name]
      properties:
        organizationId:
          type: string
          format: uuid
          description: The organization creating it; the zone is in this organization's country.
        parentId:
          type: string
          format: uuid
          description: Zone of the level just above the attachment level (a wilaya), when it exists.
        name:
          $ref: '#/components/schemas/LocalizedTextInput'

    # ---- Address (A9) ----

    AddressInput:
      type: object
      description: |
        Address of a site or a building (A9): a zone of the attachment level of the organization's country (a
        commune for Algeria), then the street address. Stored in one address table for every owner; replaced,
        never deleted (history).
      required: [zoneId, addressLine]
      properties:
        label:
          type: string
          maxLength: 100
          description: Optional name, as people say it.
          example: Entrée rue des Pins
        zoneId:
          type: string
          format: uuid
        addressLine:
          type: string
          minLength: 1
          maxLength: 300
          example: 12 rue des Pins
        postalCode:
          type: string
          maxLength: 20
          description: Optional.
          example: '16000'
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: Optional, for a map or to guide a technician to the right entrance.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180

    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          required: [countryCode, zone]
          properties:
            countryCode:
              $ref: '#/components/schemas/CountryCode'
            zone:
              $ref: '#/components/schemas/Zone'

    # ---- Organizations ----

    OrganizationType:
      type: string
      description: |
        Kind of client (glossary `OrganizationType`). `PROPERTY_DEVELOPER`: a promoteur with one or more
        residences. `RESIDENCE`: a residence that is a client on its own, without promoteur (one site only).
      enum: [PROPERTY_DEVELOPER, RESIDENCE]

    Organization:
      type: object
      required: [id, type, name, countryCode, currencyCode, active, version]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/OrganizationType'
        name:
          type: string
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        currencyCode:
          $ref: '#/components/schemas/CurrencyCode'
          description: From the country (M5); amounts of the organization are in this currency.
        contactPhone:
          type: string
        contactEmail:
          type: string
          format: email
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    OrganizationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
        page:
          $ref: '#/components/schemas/PageMeta'

    CreateOrganizationRequest:
      type: object
      required: [type, name, countryCode, owner]
      properties:
        type:
          $ref: '#/components/schemas/OrganizationType'
        name:
          type: string
          minLength: 1
          maxLength: 200
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        contactPhone:
          $ref: '#/components/schemas/PhoneInput'
        contactEmail:
          type: string
          format: email
          maxLength: 254
        owner:
          $ref: '#/components/schemas/PersonInput'

    UpdateOrganizationRequest:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        contactPhone:
          $ref: '#/components/schemas/PhoneInput'
        contactEmail:
          type: string
          format: email
          maxLength: 254
        version:
          $ref: '#/components/schemas/Version'

    OrganizationCreated:
      type: object
      required: [organization, owner]
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        owner:
          $ref: '#/components/schemas/InvitationResult'

    # ---- Sites, buildings, outdoor areas, units ----

    SiteType:
      type: string
      description: Only `RESIDENTIAL` in P1 (A5). Glossary `SiteType`.
      enum: [RESIDENTIAL]

    SiteLifecycleStatus:
      type: string
      description: Under construction or delivered. Glossary `SiteLifecycleStatus`.
      enum: [UNDER_CONSTRUCTION, OPERATING]

    SiteInput:
      type: object
      required: [type, name, address, lifecycleStatus]
      properties:
        type:
          $ref: '#/components/schemas/SiteType'
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          $ref: '#/components/schemas/AddressInput'
        lifecycleStatus:
          $ref: '#/components/schemas/SiteLifecycleStatus'

    UpdateSiteRequest:
      type: object
      required: [name, address, lifecycleStatus, active, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          $ref: '#/components/schemas/AddressInput'
        lifecycleStatus:
          $ref: '#/components/schemas/SiteLifecycleStatus'
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    Site:
      type: object
      required: [id, organizationId, type, name, countryCode, address, lifecycleStatus, active, version]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/SiteType'
        name:
          type: string
        countryCode:
          $ref: '#/components/schemas/CountryCode'
          description: The organization's country (A1, M4).
        address:
          $ref: '#/components/schemas/Address'
        lifecycleStatus:
          $ref: '#/components/schemas/SiteLifecycleStatus'
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    SitePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        page:
          $ref: '#/components/schemas/PageMeta'

    BuildingUse:
      type: string
      description: Use of a building (A5). P1 accepts only `RESIDENTIAL`. Glossary `BuildingUse`.
      enum: [RESIDENTIAL, HOTEL, CLINIC, SPORT, OTHER]

    AddressOrigin:
      type: string
      description: |
        Where a building's address comes from (A9). `SITE_COPY`: copied from the site's address when the building
        was created, never changed since. `OWN`: given at creation or edited later. Neither follows later changes
        of the site's address. Glossary `AddressOrigin`.
      enum: [SITE_COPY, OWN]

    BuildingInput:
      type: object
      required: [name, buildingUse, floorCount]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        buildingUse:
          $ref: '#/components/schemas/BuildingUse'
        floorCount:
          type: integer
          minimum: 0
          maximum: 200
          description: Floors above the ground floor (0 = ground floor only, e.g. a villa).
        address:
          $ref: '#/components/schemas/AddressInput'
          description: Optional at creation. Absent - the building receives a copy of the site's address (A9).

    UpdateBuildingRequest:
      type: object
      required: [name, buildingUse, floorCount, address, active, version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        buildingUse:
          $ref: '#/components/schemas/BuildingUse'
        floorCount:
          type: integer
          minimum: 0
          maximum: 200
        address:
          $ref: '#/components/schemas/AddressInput'
          description: Always sent. Send the current address back unchanged to keep it.
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    Building:
      type: object
      required: [id, siteId, name, buildingUse, floorCount, address, addressOrigin, active, version]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        name:
          type: string
        buildingUse:
          $ref: '#/components/schemas/BuildingUse'
        floorCount:
          type: integer
        address:
          $ref: '#/components/schemas/Address'
          description: The building's address, shown on its tickets and in lists (A9, criterion 18).
        addressOrigin:
          $ref: '#/components/schemas/AddressOrigin'
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    OutdoorAreaType:
      type: string
      description: Kind of outdoor area (A3). Glossary `OutdoorAreaType`.
      enum: [PARKING, STORAGE, PLAYGROUND, STADIUM, OTHER]

    OutdoorAreaInput:
      type: object
      required: [type, name]
      properties:
        type:
          $ref: '#/components/schemas/OutdoorAreaType'
        name:
          type: string
          minLength: 1
          maxLength: 100

    UpdateOutdoorAreaRequest:
      allOf:
        - $ref: '#/components/schemas/OutdoorAreaInput'
        - type: object
          required: [active, version]
          properties:
            active:
              type: boolean
            version:
              $ref: '#/components/schemas/Version'

    OutdoorArea:
      type: object
      required: [id, siteId, type, name, active, version]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/OutdoorAreaType'
        name:
          type: string
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    UnitType:
      type: string
      description: Kind of unit (A6). Glossary `UnitType`.
      enum: [APARTMENT, SHOP, PARKING, STORAGE, OTHER]

    UnitInput:
      type: object
      description: |
        A unit is in a building or in an outdoor area, never both. `floor` only inside a building (0 = ground
        floor, negative = basement). The category is mandatory and of the same unit type (A6). Only a `PARKING` or
        `STORAGE` can be the annex of an `APARTMENT`; a person may hold any number of them (A7).
      required: [type, categoryId, reference, saleable, rentable]
      properties:
        type:
          $ref: '#/components/schemas/UnitType'
        categoryId:
          type: string
          format: uuid
        reference:
          type: string
          minLength: 1
          maxLength: 50
          description: Unique in the site, as written on the sale documents.
          example: B-12
        buildingId:
          type: string
          format: uuid
        outdoorAreaId:
          type: string
          format: uuid
        floor:
          type: integer
          minimum: -10
          maximum: 200
        annexOfUnitId:
          type: string
          format: uuid
        saleable:
          type: boolean
        rentable:
          type: boolean

    UpdateUnitRequest:
      allOf:
        - $ref: '#/components/schemas/UnitInput'
        - type: object
          required: [active, version]
          properties:
            active:
              type: boolean
            version:
              $ref: '#/components/schemas/Version'

    Unit:
      type: object
      required: [id, siteId, type, category, reference, saleable, rentable, active, version]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/UnitType'
        category:
          $ref: '#/components/schemas/UnitCategoryRef'
        reference:
          type: string
        buildingId:
          type: string
          format: uuid
        outdoorAreaId:
          type: string
          format: uuid
        floor:
          type: integer
        annexOfUnitId:
          type: string
          format: uuid
        saleable:
          type: boolean
        rentable:
          type: boolean
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    UnitPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
        page:
          $ref: '#/components/schemas/PageMeta'

    UnitImportReport:
      type: object
      required: [outcome, totalRows, createdCount, errors]
      properties:
        outcome:
          type: string
          description: |
            `CHECKED`: dry run without errors, nothing created. `IMPORTED`: every row created.
            `REJECTED`: at least one error, nothing created.
          enum: [CHECKED, IMPORTED, REJECTED]
        totalRows:
          type: integer
        createdCount:
          type: integer
        errors:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/UnitImportError'

    UnitImportError:
      type: object
      required: [row, code]
      properties:
        row:
          type: integer
          description: Row number as shown in Excel.
        column:
          type: string
          description: Column key of the template.
          enum: [reference, type, category, building, outdoorArea, floor, annexOf, saleable, rentable]
        code:
          type: string
          description: |
            Same codes as the unit endpoints (`UNIT_REFERENCE_TAKEN`, `UNIT_LOCATION_INVALID`,
            `UNIT_CATEGORY_TYPE_MISMATCH`…), plus `IMPORT_VALUE_REQUIRED`, `IMPORT_VALUE_INVALID`,
            `IMPORT_DUPLICATE_IN_FILE`, `IMPORT_BUILDING_UNKNOWN`, `IMPORT_OUTDOOR_AREA_UNKNOWN`,
            `IMPORT_ANNEX_UNKNOWN`, `IMPORT_CATEGORY_UNKNOWN`.
        value:
          type: string
          maxLength: 100
          description: The cell value, shortened, to help the person find the mistake.

    # ---- Unit categories (A6) ----

    UnitCategoryRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: T3
        name:
          $ref: '#/components/schemas/LocalizedText'
          description: Missing languages are filled by the fallback (M6) in responses.

    UnitCategory:
      description: |
        Category of a unit (A6): the typology of an apartment (studio, T1 to T5, duplex), a free category for the
        other types. Platform defaults (`PLATFORM` scope, kept by the administrators, M7), completed by the
        organization or one site. It will drive the service charge (F1, P2). Glossary `UnitCategory`.
      allOf:
        - $ref: '#/components/schemas/UnitCategoryRef'
        - type: object
          required: [scope, unitType, sortOrder, active, version]
          properties:
            scope:
              $ref: '#/components/schemas/Scope'
            unitType:
              $ref: '#/components/schemas/UnitType'
            sortOrder:
              type: integer
            active:
              type: boolean
            version:
              $ref: '#/components/schemas/Version'

    UnitCategoryInput:
      type: object
      required: [scope, unitType, code, name]
      properties:
        scope:
          $ref: '#/components/schemas/Scope'
          description: '`ORGANIZATION` (promoteur) or `SITE` (manager of that site).'
        unitType:
          $ref: '#/components/schemas/UnitType'
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,29}$'
          description: Readable code, unique per unit type in the scope, also used in the Excel import.
          example: GRAND_MAGASIN
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100

    UpdateUnitCategoryRequest:
      type: object
      required: [name, sortOrder, active, version]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    # ---- Roles and permissions (ADR-026, revision 2) ----

    RoleCode:
      type: string
      pattern: '^[A-Z][A-Z0-9_]{1,49}$'
      description: |
        Code of a role. Roles are data (rows of the role table), so this is not a closed list: the specification's
        roles `PLATFORM_ADMIN`, `ORG_ADMIN`, `SITE_MANAGER`, `TECHNICIAN`, `RESIDENT` are the first rows; custom
        roles come later. Clients must not change behaviour on a role code - use the permissions. Glossary `Role`.
      example: SITE_MANAGER

    RoleKind:
      type: string
      description: |
        Decides who can give the role (RB-1): without `role-assignment:grant`, only roles of kind `OCCUPANT` (with
        `account:invite` or `access:approve`) and `TECHNICIAN` (with `technician:create`, sprint 4). Glossary
        `RoleKind`.
      enum: [PLATFORM, ADMINISTRATION, STAFF, TECHNICIAN, OCCUPANT]

    PermissionCode:
      type: string
      description: |
        `resource:action` (ADR-026 has the table to the specification's French names). The catalogue is defined by
        the code and grows with each sprint (C11). Glossary `Permission`.
      enum:
        - organization:create
        - organization:update
        - organization:deactivate
        - site:create
        - site:read
        - site:update
        - site:archive
        - building:create
        - building:read
        - building:update
        - building:archive
        - outdoor-area:create
        - outdoor-area:read
        - outdoor-area:update
        - outdoor-area:archive
        - zone:create-provisional
        - registration-qr:read
        - registration-qr:manage
        - unit-category:create
        - unit-category:read
        - unit-category:update
        - unit-category:archive
        - unit:create
        - unit:read
        - unit:update
        - unit:archive
        - unit:import
        - account:create
        - account:read
        - account:update
        - account:deactivate
        - account:invite
        - access:approve
        - access:refuse
        - access:restrict
        - access:revoke
        - role-assignment:grant
        - role-assignment:revoke
        - permission-adjustment:manage
        - occupancy:create
        - occupancy:read
        - occupancy:end
        - pre-registration:create
        - pre-registration:read
        - pre-registration:cancel
        - organization:read
        - reference-data:read
        - reference-data:create
        - reference-data:update
        - reference-data:archive
        - reference-data:validate-provisional
        - text:read
        - text:update
        - support:access
        - asset:create
        - asset:read
        - asset:update
        - asset:archive
        - issue-type:read
        - issue-type:manage
        - ticket:create
        - ticket:read
        - ticket:read-private
        - ticket:update-status
        - ticket:cancel
        - ticket:close
        - ticket:reopen
        - ticket-workflow:read
        - ticket-workflow:configure

    ScopeType:
      type: string
      description: |
        Where a role or a permission applies. A role or permission on an organization covers all its sites. Glossary
        `ScopeType`.
      enum: [PLATFORM, ORGANIZATION, SITE]

    Scope:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ScopeType'
        id:
          type: string
          format: uuid
          description: Organization or site ID. Absent for `PLATFORM`.

    Permission:
      type: object
      required: [code, scopeTypes, adjustable, sensitive, label, description]
      properties:
        code:
          $ref: '#/components/schemas/PermissionCode'
        scopeTypes:
          type: array
          description: Scopes this permission can apply to.
          items:
            $ref: '#/components/schemas/ScopeType'
        adjustable:
          type: boolean
          description: |
            `false` for `role-assignment:*`, `permission-adjustment:manage` and the platform permissions: they only
            come from a `grantsAll` or `PLATFORM` role and are never added or removed (C9).
        sensitive:
          type: boolean
          description: Flagged on screen when adjusted (section 3.6, for example quotes and payments later).
        label:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'

    RoleDefinition:
      type: object
      required: [code, kind, scopeTypes, label, grantsAll, editable, defaultPermissions]
      properties:
        code:
          $ref: '#/components/schemas/RoleCode'
        kind:
          $ref: '#/components/schemas/RoleKind'
        scopeTypes:
          type: array
          description: Where this role can be given (`ORG_ADMIN` on an organization, `SITE_MANAGER` on a site…).
          items:
            $ref: '#/components/schemas/ScopeType'
        organizationId:
          type: string
          format: uuid
          description: Absent for a platform role. Reserved for custom roles of an organization (later).
        label:
          $ref: '#/components/schemas/LocalizedText'
        grantsAll:
          type: boolean
          description: '`true` for `ORG_ADMIN`: every permission of the organization, present and future (C8).'
        editable:
          type: boolean
          description: '`false` for a `grantsAll` role and the platform roles.'
        defaultPermissions:
          type: array
          description: Defaults from the specification (section 3.3). Empty for a `grantsAll` role.
          items:
            $ref: '#/components/schemas/PermissionCode'

    RoleDelta:
      type: object
      description: A difference of the organization from a role's defaults (C11). Glossary `OrganizationRoleDelta`.
      required: [id, permission, effect, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        permission:
          $ref: '#/components/schemas/PermissionCode'
        effect:
          $ref: '#/components/schemas/AdjustmentEffect'
        createdBy:
          $ref: '#/components/schemas/PersonRef'
        createdAt:
          type: string
          format: date-time

    OrganizationRole:
      type: object
      required: [roleCode, defaultPermissions, deltas, effectivePermissions, customized, editable]
      properties:
        roleCode:
          $ref: '#/components/schemas/RoleCode'
        defaultPermissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'
        deltas:
          type: array
          description: Active differences of this organization (added or removed permissions).
          items:
            $ref: '#/components/schemas/RoleDelta'
        effectivePermissions:
          type: array
          description: Defaults + `ADD` − `REMOVE`; every permission for a `grantsAll` role.
          items:
            $ref: '#/components/schemas/PermissionCode'
        customized:
          type: boolean
          description: '`true` when the role has at least one active difference.'
        editable:
          type: boolean

    SetRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          description: The permissions the role should have; the server stores the differences from the defaults.
          maxItems: 200
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'
        reason:
          type: string
          maxLength: 500

    RoleAssignmentSpec:
      type: object
      required: [roleCode, scope]
      properties:
        roleCode:
          $ref: '#/components/schemas/RoleCode'
        scope:
          $ref: '#/components/schemas/Scope'

    RoleAssignmentRequest:
      allOf:
        - $ref: '#/components/schemas/RoleAssignmentSpec'
        - type: object
          required: [personId]
          properties:
            personId:
              type: string
              format: uuid

    RoleAssignment:
      type: object
      required: [id, person, roleCode, scope, assignedBy, assignedAt]
      properties:
        id:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PersonRef'
        roleCode:
          $ref: '#/components/schemas/RoleCode'
        scope:
          $ref: '#/components/schemas/Scope'
        scopeName:
          type: string
          description: Name of the organization or site.
        assignedBy:
          $ref: '#/components/schemas/PersonRef'
        assignedAt:
          type: string
          format: date-time
        endedBy:
          $ref: '#/components/schemas/PersonRef'
        endedAt:
          type: string
          format: date-time
        endReason:
          type: string

    RoleAssignmentPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        page:
          $ref: '#/components/schemas/PageMeta'

    AdjustmentEffect:
      type: string
      description: |
        `ADD` a permission, or `REMOVE` one: for one person (`PermissionAdjustment`) or for a role in an organization
        (`OrganizationRoleDelta`). Glossary `AdjustmentEffect`.
      enum: [ADD, REMOVE]

    PermissionAdjustmentRequest:
      type: object
      required: [personId, scope, permission, effect]
      properties:
        personId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/Scope'
        permission:
          $ref: '#/components/schemas/PermissionCode'
        effect:
          $ref: '#/components/schemas/AdjustmentEffect'
        reason:
          type: string
          maxLength: 500

    PermissionAdjustment:
      type: object
      required: [id, person, scope, permission, effect, createdBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PersonRef'
        scope:
          $ref: '#/components/schemas/Scope'
        permission:
          $ref: '#/components/schemas/PermissionCode'
        effect:
          $ref: '#/components/schemas/AdjustmentEffect'
        reason:
          type: string
        createdBy:
          $ref: '#/components/schemas/PersonRef'
        createdAt:
          type: string
          format: date-time
        cancelledBy:
          $ref: '#/components/schemas/PersonRef'
        cancelledAt:
          type: string
          format: date-time

    PersonPermissions:
      type: object
      required: [personId, scopes]
      properties:
        personId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: object
            required: [scope, scopeName, roles, permissions, removed]
            properties:
              scope:
                $ref: '#/components/schemas/Scope'
              scopeName:
                type: string
              roles:
                type: array
                items:
                  $ref: '#/components/schemas/RoleCode'
              permissions:
                type: array
                description: Effective permissions on this scope, each with where it comes from.
                items:
                  type: object
                  required: [permission, origin]
                  properties:
                    permission:
                      $ref: '#/components/schemas/PermissionCode'
                    origin:
                      type: string
                      description: |
                        `ROLE_DEFAULT`: a default of one of the person's roles. `ROLE_DELTA`: added to the role by the
                        organization. `ALL`: from a `grantsAll` role. `PERSON_ADDED`: a person-level adjustment.
                      enum: [ROLE_DEFAULT, ROLE_DELTA, ALL, PERSON_ADDED]
                    roleCode:
                      $ref: '#/components/schemas/RoleCode'
                    adjustmentId:
                      type: string
                      format: uuid
              removed:
                type: array
                description: Role permissions this person does not have, and why.
                items:
                  type: object
                  required: [permission, origin]
                  properties:
                    permission:
                      $ref: '#/components/schemas/PermissionCode'
                    origin:
                      type: string
                      description: '`ROLE_DELTA`: removed from the role by the organization. `PERSON_REMOVED`: for this person only.'
                      enum: [ROLE_DELTA, PERSON_REMOVED]
                    adjustmentId:
                      type: string
                      format: uuid

    # ---- People and invitations ----

    OrganizationPerson:
      type: object
      required: [id, firstName, lastName, email, phone, accountStatus, roles, siteIds]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        accountStatus:
          $ref: '#/components/schemas/AccountStatus'
        roles:
          type: array
          description: Active roles in the organization and its sites.
          items:
            $ref: '#/components/schemas/RoleAssignmentSpec'
        hasAdjustments:
          type: boolean
          description: '`true` when some permissions were added or removed for this person.'
        siteIds:
          type: array
          description: Sites of this organization where the person has an active access.
          items:
            type: string
            format: uuid

    OrganizationPersonPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationPerson'
        page:
          $ref: '#/components/schemas/PageMeta'

    OrganizationInvitationRequest:
      type: object
      required: [person, roles]
      properties:
        person:
          $ref: '#/components/schemas/PersonInput'
        roles:
          type: array
          minItems: 1
          maxItems: 50
          description: |
            Roles on the organization or on some of its sites, for example `SITE_MANAGER` on two sites or
            `TECHNICIAN` on one site (C3).
          items:
            $ref: '#/components/schemas/RoleAssignmentSpec'

    SiteInvitationRequest:
      type: object
      required: [person]
      properties:
        person:
          $ref: '#/components/schemas/PersonInput'
        roleCode:
          $ref: '#/components/schemas/RoleCode'
          description: '`RESIDENT` when absent. Any role of kind `OCCUPANT`; another kind needs `role-assignment:grant`.'
        occupancies:
          type: array
          maxItems: 50
          description: Units given to the person (several apartments, parkings and storage rooms, A7, E5).
          items:
            $ref: '#/components/schemas/OccupancyInput'
        allowedBuildingIds:
          type: array
          maxItems: 200
          description: Buildings the person may see (C7). Absent = the buildings of their units.
          items:
            type: string
            format: uuid

    InvitationResult:
      type: object
      required: [personId, outcome]
      properties:
        personId:
          type: string
          format: uuid
        outcome:
          type: string
          description: |
            `INVITED`: new account; a "set my password" link was sent to the person's e-mail (D4).
            `EXISTING_ACCOUNT`: the e-mail already has an account; access and roles apply now.
          enum: [INVITED, EXISTING_ACCOUNT]
        linkExpiresAt:
          type: string
          format: date-time
          description: Present with `INVITED`. The link itself is never returned (ADR-031).

    PasswordLinkSent:
      type: object
      required: [kind, expiresAt]
      properties:
        kind:
          type: string
          description: '`SET_PASSWORD` for an `INVITED` account, `PASSWORD_RESET` for an `ACTIVE` one.'
          enum: [SET_PASSWORD, PASSWORD_RESET]
        expiresAt:
          type: string
          format: date-time

    # ---- Site memberships, join code ----

    MembershipStatus:
      type: string
      description: Glossary `MembershipStatus` (state diagram 5.2 of the UML model).
      enum: [PENDING, ACTIVE, REJECTED, DEACTIVATED]

    MembershipOrigin:
      type: string
      description: How the access was created. Glossary `MembershipOrigin`.
      enum: [INVITATION, SELF_REGISTRATION, PRE_REGISTRATION, DIRECT_CREATION]

    OccupancyRole:
      type: string
      description: Owner or tenant; no co-owner, one active owner per unit (E4). Glossary `OccupancyRole`.
      enum: [OWNER, TENANT]

    SiteMembership:
      type: object
      required: [id, siteId, person, status, origin, allowedBuildingIds, keyOutcome, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PersonRef'
        phone:
          type: string
          description: Present for callers holding `account:read`.
        status:
          $ref: '#/components/schemas/MembershipStatus'
        origin:
          $ref: '#/components/schemas/MembershipOrigin'
        allowedBuildingIds:
          type: array
          description: Empty = every building of the site (C7).
          items:
            type: string
            format: uuid
        comment:
          type: string
          maxLength: 500
          description: |
            Free comment of the person when registering (D2), for example "Apartment B12, owner". Present for
            callers holding `access:approve` on the site. Shown as plain text.
        keyOutcome:
          $ref: '#/components/schemas/KeyOutcome'
        preRegistrationId:
          type: string
          format: uuid
          description: The pre-registration whose key matched (`MATCHED`, `MATCHED_NEEDS_REVIEW`).
        submittedAt:
          type: string
          format: date-time
          description: When the request reached the managers (e-mail verified, ADR-034).
        decidedBy:
          $ref: '#/components/schemas/PersonRef'
        decidedAt:
          type: string
          format: date-time
        decisionReason:
          type: string
        createdAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'

    SiteMembershipPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteMembership'
        page:
          $ref: '#/components/schemas/PageMeta'

    ApproveMembershipRequest:
      type: object
      required: [allowedBuildingIds, occupancies, version]
      properties:
        allowedBuildingIds:
          type: array
          maxItems: 200
          description: Buildings opened to the person (C7). Empty = every building.
          items:
            type: string
            format: uuid
        occupancies:
          type: array
          maxItems: 50
          description: Units given by the approver, usually read from the person's comment (A7, E5).
          items:
            $ref: '#/components/schemas/OccupancyInput'
        version:
          $ref: '#/components/schemas/Version'

    AllowedBuildingsRequest:
      type: object
      required: [buildingIds, version]
      properties:
        buildingIds:
          type: array
          maxItems: 200
          items:
            type: string
            format: uuid
        version:
          $ref: '#/components/schemas/Version'

    RegistrationQr:
      type: object
      required: [siteId, code, registrationUrl, enabled, updatedAt, version]
      properties:
        siteId:
          type: string
          format: uuid
        code:
          type: string
          description: 10 characters without ambiguous letters, shown in groups (ADR-034).
          example: K7QM-4XPA-2R
        registrationUrl:
          type: string
          format: uri
          description: Content of the QR code; the code is after `#` so it reaches no server log.
          example: 'https://app.example.dz/r#K7QM4XPA2R'
        enabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Version'

    RegistrationQrSettings:
      type: object
      required: [enabled, version]
      properties:
        enabled:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    RegistrationCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 20
          description: Dashes and spaces are ignored; not case sensitive.

    RegistrationQrPreview:
      type: object
      required: [siteName, organizationName]
      properties:
        siteName:
          type: string
        organizationName:
          type: string

    RegistrationRequest:
      type: object
      required: [code, firstName, lastName, email, phone, language, password]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 20
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/PhoneInput'
        language:
          $ref: '#/components/schemas/Language'
        comment:
          type: string
          maxLength: 500
          description: Free text for the manager (D2), for example "Apartment B12, owner".
        password:
          $ref: '#/components/schemas/Password'
        preRegistrationKey:
          $ref: '#/components/schemas/PreRegistrationKeyInput'

    RegistrationAccepted:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Always the same value (ADR-034).
          enum: [CHECK_YOUR_EMAIL]

    SiteAccessRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 8
          maxLength: 20
          description: Registration code of the site (from its QR code).
        comment:
          type: string
          maxLength: 500
        preRegistrationKey:
          $ref: '#/components/schemas/PreRegistrationKeyInput'

    KeyOutcome:
      type: string
      description: |
        What the pre-registration key typed by the person gave (D3, ADR-034). `NONE`: no key. `MATCHED`: key and
        e-mail matched, approved automatically. `MATCHED_NEEDS_REVIEW`: matched, but a planned unit was no longer
        free (E3, E4): the manager decides. `NOT_MATCHED`: wrong, expired or used key, or another e-mail; manual
        approval. Glossary `KeyOutcome`.
      enum: [NONE, MATCHED, MATCHED_NEEDS_REVIEW, NOT_MATCHED]

    # ---- Pre-registrations (D3, ADR-034) ----

    PreRegistrationKeyInput:
      type: string
      minLength: 12
      maxLength: 20
      writeOnly: true
      description: Personal key (D3). Dashes and spaces are ignored; not case sensitive. Never logged.
      example: 4XPA-K7QM-9RTW

    PreRegistrationStatus:
      type: string
      description: |
        `EXPIRED` is computed from `expiresAt` for a pending one, never stored. Glossary `PreRegistrationStatus`.
      enum: [PENDING, USED, CANCELLED, EXPIRED]

    PlannedOccupancy:
      type: object
      required: [unitId, role]
      properties:
        unitId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OccupancyRole'
        primaryTenant:
          type: boolean
          default: false
          description: Only for a `TENANT` (E3).

    PlannedOccupancyView:
      allOf:
        - $ref: '#/components/schemas/PlannedOccupancy'
        - type: object
          required: [unitReference, unitType]
          properties:
            unitReference:
              type: string
            unitType:
              $ref: '#/components/schemas/UnitType'

    PreRegistrationRequest:
      type: object
      required: [person, plannedOccupancies]
      properties:
        person:
          $ref: '#/components/schemas/PersonInput'
        plannedOccupancies:
          type: array
          minItems: 1
          maxItems: 50
          description: Several apartments, parkings and storage rooms (A7, E1).
          items:
            $ref: '#/components/schemas/PlannedOccupancy'
        keyValidDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30

    RenewPreRegistrationKeyRequest:
      type: object
      required: [version]
      properties:
        keyValidDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
        version:
          $ref: '#/components/schemas/Version'

    PreRegistration:
      type: object
      required: [id, siteId, firstName, lastName, email, phone, language, plannedOccupancies, status, origin,
                 expiresAt, createdBy, createdAt, version]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          description: E.164.
        language:
          $ref: '#/components/schemas/Language'
        plannedOccupancies:
          type: array
          items:
            $ref: '#/components/schemas/PlannedOccupancyView'
        status:
          $ref: '#/components/schemas/PreRegistrationStatus'
        origin:
          type: string
          description: Glossary `PreRegistrationOrigin`.
          enum: [MANUAL, IMPORT]
        expiresAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/PersonRef'
        createdAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
        membershipId:
          type: string
          format: uuid
          description: The access created when the key was used.
        cancelledAt:
          type: string
          format: date-time
        cancelReason:
          type: string
        version:
          $ref: '#/components/schemas/Version'

    PreRegistrationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreRegistration'
        page:
          $ref: '#/components/schemas/PageMeta'

    PreRegistrationIssued:
      type: object
      required: [preRegistration, key]
      properties:
        preRegistration:
          $ref: '#/components/schemas/PreRegistration'
        key:
          type: string
          description: The personal key, shown this once (D3). Never stored in clear, never logged.
          example: 4XPA-K7QM-9RTW

    ResidentImportReport:
      type: object
      required: [outcome, totalRows, createdCount, errors, keys]
      properties:
        outcome:
          type: string
          description: Same meaning as `UnitImportReport.outcome`.
          enum: [CHECKED, IMPORTED, REJECTED]
        totalRows:
          type: integer
        createdCount:
          type: integer
          description: Pre-registrations created (one per e-mail).
        errors:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ResidentImportError'
        keys:
          type: array
          description: Only when `outcome` is `IMPORTED`; shown this once.
          items:
            type: object
            required: [preRegistrationId, firstName, lastName, email, key, expiresAt]
            properties:
              preRegistrationId:
                type: string
                format: uuid
              firstName:
                type: string
              lastName:
                type: string
              email:
                type: string
                format: email
              key:
                type: string
              expiresAt:
                type: string
                format: date-time

    ResidentImportError:
      type: object
      required: [row, code]
      properties:
        row:
          type: integer
          description: Row number as shown in Excel.
        column:
          type: string
          description: Column key of the template.
          enum: [lastName, firstName, email, phone, language, unit, role, primaryTenant]
        code:
          type: string
          description: |
            Same codes as the pre-registration endpoint (`PHONE_INVALID`, `OCCUPANCY_OWNER_EXISTS`,
            `PRE_REGISTRATION_EXISTS`, `MEMBERSHIP_EXISTS`…), plus `IMPORT_VALUE_REQUIRED`, `IMPORT_VALUE_INVALID`,
            `IMPORT_DUPLICATE_IN_FILE`, `IMPORT_UNIT_UNKNOWN`, `IMPORT_PERSON_MISMATCH`.
        value:
          type: string
          maxLength: 100
          description: The cell value, shortened. Never a key.

    # ---- Occupancies ----

    OccupancyInput:
      type: object
      required: [unitId, role]
      properties:
        unitId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/OccupancyRole'
        primaryTenant:
          type: boolean
          default: false
          description: Only for a `TENANT`; at most one active primary tenant per unit (E3).
        startedOn:
          type: string
          format: date
          description: Defaults to today.

    StartOccupancyRequest:
      allOf:
        - $ref: '#/components/schemas/OccupancyInput'
        - type: object
          required: [personId]
          properties:
            personId:
              type: string
              format: uuid

    EndOccupancyRequest:
      type: object
      required: [endedOn, reason]
      properties:
        endedOn:
          type: string
          format: date
        reason:
          type: string
          minLength: 1
          maxLength: 500

    Occupancy:
      type: object
      required: [id, unitId, siteId, person, role, primaryTenant, startedOn]
      properties:
        id:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        person:
          $ref: '#/components/schemas/PersonRef'
        role:
          $ref: '#/components/schemas/OccupancyRole'
        primaryTenant:
          type: boolean
        startedOn:
          type: string
          format: date
        endedOn:
          type: string
          format: date
        endReason:
          type: string

    # ---- Me ----

    MyAccess:
      type: object
      required: [platformPermissions, organizations, sites]
      properties:
        supportSession:
          $ref: '#/components/schemas/SupportSession'
          description: |
            The caller's open support session (ADR-035); its organization then appears in `organizations` with the
            promoteur's permissions. The application shows a banner while it is present.
        platformPermissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'
        organizations:
          type: array
          items:
            type: object
            required: [id, type, name, permissions]
            properties:
              id:
                type: string
                format: uuid
              type:
                $ref: '#/components/schemas/OrganizationType'
              name:
                type: string
              roles:
                type: array
                description: Roles on the organization itself.
                items:
                  $ref: '#/components/schemas/RoleCode'
              permissions:
                type: array
                description: Effective permissions on the organization (all of them for a `grantsAll` role).
                items:
                  $ref: '#/components/schemas/PermissionCode'
        sites:
          type: array
          description: Sites with an active access or a role, with effective permissions (organization and site).
          items:
            type: object
            required: [id, organizationId, name, roles, permissions, allowedBuildingIds, occupiedUnitIds]
            properties:
              id:
                type: string
                format: uuid
              organizationId:
                type: string
                format: uuid
              name:
                type: string
              roles:
                type: array
                description: Roles on this site, plus those inherited from the organization.
                items:
                  $ref: '#/components/schemas/RoleCode'
              permissions:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionCode'
              allowedBuildingIds:
                type: array
                description: Empty = every building.
                items:
                  type: string
                  format: uuid
              occupiedUnitIds:
                type: array
                items:
                  type: string
                  format: uuid

    MyMembership:
      type: object
      required: [membershipId, siteId, siteName, organizationName, status, occupancies]
      properties:
        membershipId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        siteName:
          type: string
        organizationName:
          type: string
        status:
          $ref: '#/components/schemas/MembershipStatus'
        occupancies:
          type: array
          items:
            type: object
            required: [occupancyId, unitId, unitReference, unitType, role, startedOn]
            properties:
              occupancyId:
                type: string
                format: uuid
              unitId:
                type: string
                format: uuid
              unitReference:
                type: string
              unitType:
                $ref: '#/components/schemas/UnitType'
              role:
                $ref: '#/components/schemas/OccupancyRole'
              startedOn:
                type: string
                format: date

    # ---- Notifications ----

    NotificationTemplate:
      type: string
      description: |
        What happened. The application writes the text in the reader's language from the template and `params`.
        Glossary `NotificationTemplate`.
      enum: [ACCESS_REQUESTED, ACCESS_AUTO_APPROVED, ACCESS_APPROVED, ACCESS_REJECTED, TICKET_CREATED, TICKET_ROUTED,
             TICKET_STATUS_CHANGED]

    Notification:
      type: object
      required: [id, template, params, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        template:
          $ref: '#/components/schemas/NotificationTemplate'
        params:
          type: object
          description: Values for the text, for example `personName` and `siteName`. Never an amount (J3).
          additionalProperties:
            type: string
        link:
          type: string
          description: Path inside the application, for example `/sites/{siteId}/memberships?status=PENDING`.
        siteId:
          type: string
          format: uuid
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page:
          $ref: '#/components/schemas/PageMeta'

    UnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer

    # ---- Text dictionary (M6, ADR-029) ----

    TextOrigin:
      type: string
      description: '`SEED`: delivered by the team. `EDITED`: changed by an administrator, never overwritten by a release. Glossary `TextOrigin`.'
      enum: [SEED, EDITED]

    TextBundle:
      type: object
      required: [language, version, texts]
      properties:
        language:
          $ref: '#/components/schemas/Language'
        version:
          type: string
          description: Same value as the `ETag` header.
        texts:
          type: object
          description: Key to text. Variables are written `{{name}}`.
          additionalProperties:
            type: string
          example:
            auth.login.title: Sign in

    TextValue:
      type: object
      required: [key, language, text, origin, version, updatedAt]
      properties:
        key:
          type: string
        language:
          $ref: '#/components/schemas/Language'
        text:
          type: string
        origin:
          $ref: '#/components/schemas/TextOrigin'
        seedText:
          type: string
          description: The text delivered by the team, to compare with an edited one.
        version:
          $ref: '#/components/schemas/Version'
        updatedBy:
          $ref: '#/components/schemas/PersonRef'
        updatedAt:
          type: string
          format: date-time

    TextRow:
      type: object
      required: [key, values]
      properties:
        key:
          type: string
        variables:
          type: array
          description: The `{{name}}` variables every language must keep.
          items:
            type: string
        values:
          type: array
          description: One per language that has a text; a missing language is absent.
          items:
            $ref: '#/components/schemas/TextValue'

    TextRowPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TextRow'
        page:
          $ref: '#/components/schemas/PageMeta'

    UpdateTextRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text. Keeps the `{{name}}` variables of the key.
        version:
          $ref: '#/components/schemas/Version'
          description: The version read; absent when the language had no text yet.

    TextRevision:
      type: object
      required: [id, key, language, newText, origin, actor, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        language:
          $ref: '#/components/schemas/Language'
        oldText:
          type: string
        newText:
          type: string
        origin:
          $ref: '#/components/schemas/TextOrigin'
        actor:
          type: string
          description: '`SYSTEM` for a release, otherwise the person.'
          enum: [PERSON, SYSTEM]
        changedBy:
          $ref: '#/components/schemas/PersonRef'
        recordedAt:
          type: string
          format: date-time

    TextRevisionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TextRevision'
        page:
          $ref: '#/components/schemas/PageMeta'

    # ---- Back-office (C12, ADR-035) ----

    RequiredReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500

    VersionedReasonRequest:
      type: object
      required: [version]
      properties:
        reason:
          type: string
          maxLength: 500
        version:
          $ref: '#/components/schemas/Version'

    AdminOrganization:
      allOf:
        - $ref: '#/components/schemas/Organization'
        - type: object
          required: [siteCount, ownerCount, createdAt]
          properties:
            siteCount:
              type: integer
            ownerCount:
              type: integer
              description: People with an active `ORG_ADMIN` role (C8).
            createdAt:
              type: string
              format: date-time
            deactivatedAt:
              type: string
              format: date-time

    AdminOrganizationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrganization'
        page:
          $ref: '#/components/schemas/PageMeta'

    AdminZone:
      allOf:
        - $ref: '#/components/schemas/Zone'
        - type: object
          required: [addressCount, version]
          properties:
            addressCount:
              type: integer
              description: Active addresses attached to this zone.
            createdByOrganization:
              $ref: '#/components/schemas/OrganizationRef'
              description: For a provisional zone, the organization that created it.
            mergedInto:
              $ref: '#/components/schemas/ZoneRef'
            createdAt:
              type: string
              format: date-time
            version:
              $ref: '#/components/schemas/Version'

    OrganizationRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    AdminZonePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminZone'
        page:
          $ref: '#/components/schemas/PageMeta'

    ZoneInput:
      type: object
      required: [countryCode, code, name]
      properties:
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        parentId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,20}$'
          description: Official code, unique under the parent (Algeria - wilaya `16`, commune `1601`).
        name:
          $ref: '#/components/schemas/LocalizedTextInput'

    UpdateZoneRequest:
      type: object
      required: [code, name, version]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,20}$'
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        version:
          $ref: '#/components/schemas/Version'

    ValidateZoneRequest:
      type: object
      required: [code, version]
      properties:
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,20}$'
        parentId:
          type: string
          format: uuid
          description: Final parent (the level just above the attachment level); unchanged when absent.
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
          description: Corrected names; unchanged when absent.
        version:
          $ref: '#/components/schemas/Version'

    MergeZoneRequest:
      type: object
      required: [targetZoneId, version]
      properties:
        targetZoneId:
          type: string
          format: uuid
          description: A `VALIDATED` zone of the same country and level.
        version:
          $ref: '#/components/schemas/Version'
          description: Version of the provisional zone.

    PlatformUnitCategoryInput:
      type: object
      required: [unitType, code, name]
      properties:
        unitType:
          $ref: '#/components/schemas/UnitType'
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,29}$'
          example: T6
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100

    StartSupportSessionRequest:
      type: object
      required: [organizationId, reason]
      properties:
        organizationId:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 10
          maxLength: 500
          description: Why the access is needed, for example the support ticket number (C12).

    SupportSessionStatus:
      type: string
      description: '`EXPIRED` is computed after 1 hour, never stored. Glossary `SupportSessionStatus`.'
      enum: [OPEN, ENDED, EXPIRED]

    SupportSession:
      type: object
      required: [id, organization, administrator, reason, status, startedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        administrator:
          $ref: '#/components/schemas/PersonRef'
        reason:
          type: string
        status:
          $ref: '#/components/schemas/SupportSessionStatus'
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time

    SupportSessionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupportSession'
        page:
          $ref: '#/components/schemas/PageMeta'

    # =====================================================================================================
    # Sprint 3
    # =====================================================================================================

    VersionOnly:
      type: object
      required: [version]
      properties:
        version:
          $ref: '#/components/schemas/Version'

    OwnerScope:
      type: string
      description: |
        Who owns a reference item: the platform (defaults kept by the administrators, M7) or one organization
        (its own additions, visible only to it). Glossary `OwnerScope`.
      enum: [PLATFORM, ORGANIZATION]

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    # ---- Files (ADR-038) ----

    FilePurpose:
      type: string
      description: |
        `TICKET_PHOTO`: JPEG or PNG, at most 8 MB received, re-encoded as JPEG. `ASSET_DOCUMENT`: PDF, JPEG or PNG,
        at most 10 MB, images re-encoded. Glossary `FilePurpose`.
      enum: [TICKET_PHOTO, ASSET_DOCUMENT]

    UploadedFile:
      type: object
      required: [id, purpose, contentType, sizeBytes, uploadedAt, usableUntil]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/FilePurpose'
        contentType:
          type: string
          description: Detected from the content, after re-encoding.
          enum: [image/jpeg, application/pdf]
        sizeBytes:
          type: integer
          format: int64
        originalName:
          type: string
          maxLength: 120
          description: Cleaned name, for display only.
        uploadedAt:
          type: string
          format: date-time
        usableUntil:
          type: string
          format: date-time
          description: Attach it before this time (24 hours).

    SignedFileLink:
      type: object
      required: [fileId, url, contentType, expiresAt]
      properties:
        fileId:
          type: string
          format: uuid
        url:
          type: string
          description: Relative URL of `GET /v1/files/{fileId}/content`, valid 5 minutes. Fetch a fresh one by reloading.
        contentType:
          type: string
        expiresAt:
          type: string
          format: date-time

    # ---- Equipment (G1 to G4, ADR-039) ----

    AssetFamily:
      type: object
      required: [id, scope, code, name, sortOrder, active, models, version]
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/OwnerScope'
        code:
          type: string
          example: ELEVATOR
        name:
          $ref: '#/components/schemas/LocalizedText'
        sortOrder:
          type: integer
        active:
          type: boolean
        models:
          type: array
          items:
            $ref: '#/components/schemas/AssetModel'
        version:
          $ref: '#/components/schemas/Version'

    AssetFamilyInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,29}$'
          description: Readable code, also used in the Excel import.
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100

    UpdateAssetFamilyRequest:
      type: object
      required: [name, sortOrder, active, version]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    AssetModel:
      type: object
      required: [id, familyId, scope, name, active, version]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/OwnerScope'
        name:
          type: string
        modelVersion:
          type: string
          description: Version or reference of the manufacturer.
        manufacturer:
          type: string
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    AssetModelInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        modelVersion:
          type: string
          maxLength: 50
        manufacturer:
          type: string
          maxLength: 100

    UpdateAssetModelRequest:
      allOf:
        - $ref: '#/components/schemas/AssetModelInput'
        - type: object
          required: [active, version]
          properties:
            active:
              type: boolean
            version:
              $ref: '#/components/schemas/Version'

    AttributeDataType:
      type: string
      description: Glossary `DataType`.
      enum: [TEXT, INTEGER, DECIMAL, DATE, BOOLEAN, LIST]

    AttributeOption:
      type: object
      required: [code, label, active]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,29}$'
        label:
          $ref: '#/components/schemas/LocalizedText'
        active:
          type: boolean

    AttributeOptionInput:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,29}$'
        label:
          $ref: '#/components/schemas/LocalizedTextInput'
        active:
          type: boolean
          default: true

    AttributeDefinition:
      description: |
        One characteristic of an equipment family (G3, ADR-039), shown and edited by the "Caractéristiques" block.
        Values are stored in the equipment's `attributes`, keyed by `code`. Glossary `AttributeDefinition`.
      type: object
      required: [id, scope, familyId, code, dataType, required, label, sortOrder, active, version]
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/OwnerScope'
        familyId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[a-z][a-zA-Z0-9]{0,39}$'
          example: capacityKg
        dataType:
          $ref: '#/components/schemas/AttributeDataType'
        required:
          type: boolean
        label:
          $ref: '#/components/schemas/LocalizedText'
        unit:
          type: string
          description: Unit shown after the value, for example `kg`.
        options:
          type: array
          description: Choices of a `LIST`.
          items:
            $ref: '#/components/schemas/AttributeOption'
        sortOrder:
          type: integer
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    AttributeDefinitionInput:
      type: object
      required: [scope, code, dataType, label]
      properties:
        scope:
          $ref: '#/components/schemas/OwnerScope'
        organizationId:
          type: string
          format: uuid
          description: Required for scope `ORGANIZATION`.
        code:
          type: string
          pattern: '^[a-z][a-zA-Z0-9]{0,39}$'
        dataType:
          $ref: '#/components/schemas/AttributeDataType'
        required:
          type: boolean
          default: false
        label:
          $ref: '#/components/schemas/LocalizedTextInput'
        unit:
          type: string
          maxLength: 10
        options:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AttributeOptionInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100

    UpdateAttributeDefinitionRequest:
      type: object
      required: [required, label, sortOrder, active, version]
      properties:
        required:
          type: boolean
        label:
          $ref: '#/components/schemas/LocalizedTextInput'
        unit:
          type: string
          maxLength: 10
        options:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AttributeOptionInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    AttributeValues:
      type: object
      description: |
        Values of the characteristics, keyed by definition code. Strings for `TEXT` (500 characters at most), `DATE`
        (`YYYY-MM-DD`) and `LIST` (option code); numbers for `INTEGER` and `DECIMAL`; booleans for `BOOLEAN`.
      additionalProperties:
        oneOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean

    Supplier:
      type: object
      required: [id, organizationId, name, active, version]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
          description: As typed without spaces or separators, 6 to 15 digits; landlines accepted (a company number).
        email:
          type: string
          format: email
        activity:
          type: string
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    SupplierInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          maxLength: 30
          description: Any number, landline included (`PHONE_INVALID` unless 6 to 15 digits once separators removed).
        email:
          type: string
          format: email
          maxLength: 254
        activity:
          type: string
          maxLength: 120

    UpdateSupplierRequest:
      allOf:
        - $ref: '#/components/schemas/SupplierInput'
        - type: object
          required: [active, version]
          properties:
            active:
              type: boolean
            version:
              $ref: '#/components/schemas/Version'

    AssetState:
      type: string
      description: In service, out of order, decommissioned. Archiving is separate (`archived`). Glossary `AssetState`.
      enum: [IN_SERVICE, OUT_OF_ORDER, DECOMMISSIONED]

    AssetDocumentType:
      type: string
      description: Glossary `AssetDocumentType`.
      enum: [MANUAL, CERTIFICATE, INVOICE, PHOTO, OTHER]

    AssetFamilyRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'

    AssetSummary:
      description: Resident view of an equipment (C4, ADR-039).
      type: object
      required: [id, siteId, siteName, family, name, reference, state, archived]
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        siteName:
          type: string
        family:
          $ref: '#/components/schemas/AssetFamilyRef'
        model:
          $ref: '#/components/schemas/NamedRef'
        name:
          type: string
        reference:
          type: string
        building:
          $ref: '#/components/schemas/NamedRef'
        floor:
          type: integer
        outdoorArea:
          $ref: '#/components/schemas/NamedRef'
        state:
          $ref: '#/components/schemas/AssetState'
        archived:
          type: boolean
        qrCode:
          type: string
          pattern: '^[A-Z2-7]{26}$'
          description: Present only with `asset:update` (labels). The label shows `https://<host>/q/<qrCode>`.

    Asset:
      allOf:
        - $ref: '#/components/schemas/AssetSummary'
        - type: object
          required: [version]
          properties:
            management:
              $ref: '#/components/schemas/AssetManagement'
            version:
              $ref: '#/components/schemas/Version'

    AssetManagement:
      description: Present only with `asset:update` (ADR-039).
      type: object
      required: [attributes, documents, warranties]
      properties:
        serialNumber:
          type: string
        commissionedOn:
          type: string
          format: date
        supplier:
          $ref: '#/components/schemas/Supplier'
        attributes:
          $ref: '#/components/schemas/AttributeValues'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AssetDocument'
        warranties:
          type: array
          items:
            $ref: '#/components/schemas/Warranty'

    AssetDocument:
      type: object
      required: [id, type, title, file, addedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AssetDocumentType'
        title:
          type: string
        file:
          $ref: '#/components/schemas/SignedFileLink'
        addedAt:
          type: string
          format: date-time

    AssetDocumentInput:
      type: object
      required: [fileId, type, title]
      properties:
        fileId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AssetDocumentType'
        title:
          type: string
          minLength: 1
          maxLength: 120

    Warranty:
      type: object
      required: [id, startDate, endDate, alertDaysBefore, active, version]
      properties:
        id:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        alertDaysBefore:
          type: integer
        documentId:
          type: string
          format: uuid
          description: One of the equipment's documents.
        note:
          type: string
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    WarrantyInput:
      type: object
      required: [startDate, endDate]
      properties:
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        alertDaysBefore:
          type: integer
          minimum: 0
          maximum: 365
          default: 30
        documentId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 300

    UpdateWarrantyRequest:
      allOf:
        - $ref: '#/components/schemas/WarrantyInput'
        - type: object
          required: [active, version]
          properties:
            active:
              type: boolean
            version:
              $ref: '#/components/schemas/Version'

    AssetInput:
      type: object
      required: [familyId, name]
      properties:
        familyId:
          type: string
          format: uuid
        modelId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        reference:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_./-]{0,39}$'
          description: Unique in the site; generated from the family code when absent.
        buildingId:
          type: string
          format: uuid
        floor:
          type: integer
          minimum: -10
          maximum: 200
        outdoorAreaId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/AssetState'
        serialNumber:
          type: string
          maxLength: 80
        commissionedOn:
          type: string
          format: date
        supplierId:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/AttributeValues'

    UpdateAssetRequest:
      type: object
      required: [name, reference, state, attributes, version]
      properties:
        modelId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        reference:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_./-]{0,39}$'
        buildingId:
          type: string
          format: uuid
        floor:
          type: integer
          minimum: -10
          maximum: 200
        outdoorAreaId:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/AssetState'
        serialNumber:
          type: string
          maxLength: 80
        commissionedOn:
          type: string
          format: date
        supplierId:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/AttributeValues'
        version:
          $ref: '#/components/schemas/Version'

    AssetPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AssetSummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    AssetImportReport:
      type: object
      required: [outcome, totalRows, createdCount, errors]
      properties:
        outcome:
          type: string
          description: Same meaning as the unit import.
          enum: [CHECKED, IMPORTED, REJECTED]
        totalRows:
          type: integer
        createdCount:
          type: integer
        errors:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/AssetImportError'

    AssetImportError:
      type: object
      required: [row, code]
      properties:
        row:
          type: integer
          description: Row number as shown in Excel.
        column:
          type: string
          description: Column key of the template.
          enum: [name, family, model, reference, building, floor, outdoorArea, serialNumber, state, commissionedOn,
                 supplier]
        code:
          type: string
          description: |
            Same codes as the equipment endpoints, plus `IMPORT_VALUE_REQUIRED`, `IMPORT_VALUE_INVALID`,
            `IMPORT_DUPLICATE_IN_FILE`, `IMPORT_FAMILY_UNKNOWN`, `IMPORT_MODEL_UNKNOWN`, `IMPORT_BUILDING_UNKNOWN`,
            `IMPORT_OUTDOOR_AREA_UNKNOWN`, `IMPORT_SUPPLIER_UNKNOWN`.
        value:
          type: string
          maxLength: 100

    # ---- Issue categories and types (H2 to H4, H8, ADR-037) ----

    Visibility:
      type: string
      description: |
        `COMMON`: seen by every member of the residence, read only (H8). `PRIVATE`: seen by the requester, the
        occupants of the unit, the managers, the promoteur and the assigned technicians. Glossary `Visibility`.
      enum: [COMMON, PRIVATE]

    RoutingDestination:
      type: string
      description: Who receives a new ticket of this type (H4). Glossary `RoutingDestination`.
      enum: [SITE_MANAGER, TECHNICIANS]

    IssueCatalogType:
      type: object
      required: [id, code, name, assetRequired, visibility]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        assetRequired:
          type: boolean
        visibility:
          $ref: '#/components/schemas/Visibility'

    IssueCatalogCategory:
      type: object
      required: [id, code, name, types]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        types:
          type: array
          items:
            $ref: '#/components/schemas/IssueCatalogType'

    IssueCategory:
      type: object
      required: [id, scope, code, name, sortOrder, active, types, version]
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/OwnerScope'
        code:
          type: string
          example: TECHNICAL
        name:
          $ref: '#/components/schemas/LocalizedText'
        sortOrder:
          type: integer
        active:
          type: boolean
        types:
          type: array
          items:
            $ref: '#/components/schemas/IssueType'
        version:
          $ref: '#/components/schemas/Version'

    IssueCategoryInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,29}$'
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100

    UpdateIssueCategoryRequest:
      type: object
      required: [name, sortOrder, active, version]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    IssueType:
      type: object
      required: [id, categoryId, scope, code, name, assetRequired, defaultVisibility, assetFamilyIds, sortOrder,
                 active, version]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/OwnerScope'
        code:
          type: string
          example: ELEVATOR_STUCK
        name:
          $ref: '#/components/schemas/LocalizedText'
        assetRequired:
          type: boolean
          description: H3 - true for technical types.
        defaultVisibility:
          $ref: '#/components/schemas/Visibility'
        assetFamilyIds:
          type: array
          description: Families this type fits, to filter the choice from an equipment QR code; empty means all.
          items:
            type: string
            format: uuid
        sortOrder:
          type: integer
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    IssueTypeInput:
      type: object
      required: [code, name, assetRequired, defaultVisibility]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{0,39}$'
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        assetRequired:
          type: boolean
        defaultVisibility:
          $ref: '#/components/schemas/Visibility'
        assetFamilyIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100

    UpdateIssueTypeRequest:
      type: object
      required: [name, assetRequired, defaultVisibility, assetFamilyIds, sortOrder, active, version]
      properties:
        name:
          $ref: '#/components/schemas/LocalizedTextInput'
        assetRequired:
          type: boolean
        defaultVisibility:
          $ref: '#/components/schemas/Visibility'
        assetFamilyIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        sortOrder:
          type: integer
          minimum: 0
          maximum: 1000
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'

    IssueTypeConfig:
      description: Routing and visibility of one issue type on one site (H4, H8). Glossary `SiteIssueTypeConfig`.
      type: object
      required: [issueType, categoryName, configured, routing, technicians, visibility, active]
      properties:
        issueType:
          $ref: '#/components/schemas/IssueType'
        categoryName:
          $ref: '#/components/schemas/LocalizedText'
        configured:
          type: boolean
          description: False when the site uses the defaults (manager, type's visibility, active).
        routing:
          $ref: '#/components/schemas/RoutingDestination'
        technicians:
          type: array
          items:
            $ref: '#/components/schemas/PersonRef'
        visibility:
          $ref: '#/components/schemas/Visibility'
        active:
          type: boolean
          description: False hides the type on this site.
        version:
          $ref: '#/components/schemas/Version'

    IssueTypeConfigInput:
      type: object
      required: [routing, visibility, active]
      properties:
        routing:
          $ref: '#/components/schemas/RoutingDestination'
        technicianIds:
          type: array
          description: One to five people with `TECHNICIANS`; empty with `SITE_MANAGER`.
          maxItems: 5
          items:
            type: string
            format: uuid
        visibility:
          $ref: '#/components/schemas/Visibility'
        active:
          type: boolean
        version:
          $ref: '#/components/schemas/Version'
          description: Absent for the first setting of this type on the site.

    # ---- Tickets (H1 to H10, ADR-036, ADR-037) ----

    NodeCategory:
      type: string
      description: |
        Fixed category of a circuit step, the same for every circuit: notifications, filters and indicators rely on
        it (ADR-036). Glossary `NodeCategory`.
      enum: [OPEN, IN_PROGRESS, ON_HOLD, RESOLVED, CLOSED, CANCELLED]

    HoldReason:
      type: string
      description: Why a ticket waits (H5). `OTHER` needs a comment. Glossary `HoldReason`.
      enum: [PART, QUOTE, ACCESS, OTHER]

    TicketStatus:
      type: object
      required: [code, category, label]
      properties:
        code:
          type: string
          description: Step code in the circuit (`REQUESTED`, `IN_PROGRESS`…); depends on the client's circuit.
        category:
          $ref: '#/components/schemas/NodeCategory'
        label:
          $ref: '#/components/schemas/LocalizedText'
          description: The client's label (H5 option), else the circuit's.
        since:
          type: string
          format: date-time
        holdReason:
          $ref: '#/components/schemas/HoldReason'

    TicketLocation:
      type: object
      properties:
        building:
          $ref: '#/components/schemas/NamedRef'
        floor:
          type: integer
        outdoorArea:
          $ref: '#/components/schemas/NamedRef'
        unit:
          type: object
          required: [id, reference]
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
        address:
          $ref: '#/components/schemas/TicketAddress'
          description: The building's address (its own or the copy of the site's), else the site's (criterion 18).

    TicketAddress:
      description: Address shown next to a ticket (A9, criterion 18).
      type: object
      required: [addressLine, zoneName]
      properties:
        label:
          type: string
        addressLine:
          type: string
        postalCode:
          type: string
        zoneName:
          $ref: '#/components/schemas/LocalizedText'
          description: Name of the attachment zone (Algeria - the commune).

    TicketSummary:
      type: object
      required: [id, reference, siteId, siteName, nature, issueType, visibility, status, location, mine, photoCount,
                 createdAt, lastChangeAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: T-000123
        siteId:
          type: string
          format: uuid
        siteName:
          type: string
        nature:
          type: string
          description: '`PREVENTIVE` arrives in sprint 4. Glossary `TicketNature`.'
          enum: [CORRECTIVE, PREVENTIVE]
        issueType:
          type: object
          required: [id, code, name, categoryName]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              $ref: '#/components/schemas/LocalizedText'
            categoryName:
              $ref: '#/components/schemas/LocalizedText'
        visibility:
          $ref: '#/components/schemas/Visibility'
        status:
          $ref: '#/components/schemas/TicketStatus'
        location:
          $ref: '#/components/schemas/TicketLocation'
        asset:
          type: object
          required: [id, name, reference]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            reference:
              type: string
        mine:
          type: boolean
          description: The caller is the requester.
        photoCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastChangeAt:
          type: string
          format: date-time

    TicketPhoto:
      type: object
      required: [id, file, addedAt]
      properties:
        id:
          type: string
          format: uuid
        file:
          $ref: '#/components/schemas/SignedFileLink'
        addedAt:
          type: string
          format: date-time

    Ticket:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          required: [minimized, photos, technicians, version]
          properties:
            minimized:
              type: boolean
              description: |
                True when the caller sees the ticket only as a common ticket of their residence: no requester, no
                description author, no photos, no technician names (ADR-037).
            description:
              type: string
            requester:
              $ref: '#/components/schemas/PersonRef'
              description: Absent when minimized or for a ticket created by the system.
            photos:
              type: array
              maxItems: 3
              items:
                $ref: '#/components/schemas/TicketPhoto'
            technicians:
              type: array
              description: Assigned technicians (routing in sprint 3, manual changes in sprint 4).
              items:
                $ref: '#/components/schemas/PersonRef'
            canAddPhoto:
              type: boolean
            version:
              $ref: '#/components/schemas/Version'

    TicketPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TicketSummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    TicketInput:
      type: object
      required: [siteId, issueTypeId]
      properties:
        siteId:
          type: string
          format: uuid
        issueTypeId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
          description: When given, the location is taken from the equipment and the fields below are ignored.
        buildingId:
          type: string
          format: uuid
        floor:
          type: integer
          minimum: -10
          maximum: 200
        outdoorAreaId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 2000
        photoFileIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            format: uuid

    AvailableTransition:
      type: object
      required: [code, to, reasonRequired, commentRequired]
      properties:
        code:
          type: string
          example: put_on_hold
        label:
          $ref: '#/components/schemas/LocalizedText'
          description: Name of the action, from the text dictionary (`workflow.transition.<code>`).
        to:
          type: object
          required: [code, category, label]
          properties:
            code:
              type: string
            category:
              $ref: '#/components/schemas/NodeCategory'
            label:
              $ref: '#/components/schemas/LocalizedText'
        reasonRequired:
          type: boolean
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/HoldReason'
        commentRequired:
          type: boolean
          description: Always required (cancel by the manager).
        commentRequiredForReasons:
          type: array
          items:
            $ref: '#/components/schemas/HoldReason'

    TransitionRequest:
      type: object
      required: [transition, version]
      properties:
        transition:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,49}$'
        reason:
          $ref: '#/components/schemas/HoldReason'
        comment:
          type: string
          maxLength: 500
        version:
          $ref: '#/components/schemas/Version'

    TicketHistoryEntry:
      type: object
      required: [at, kind, actor]
      properties:
        at:
          type: string
          format: date-time
        kind:
          type: string
          description: '`STEP`: a passage of the circuit. `ACTIVITY`: another change.'
          enum: [STEP, ACTIVITY]
        transition:
          type: string
          description: Passage code, for `STEP`.
        from:
          $ref: '#/components/schemas/TicketStatus'
        to:
          $ref: '#/components/schemas/TicketStatus'
        reason:
          $ref: '#/components/schemas/HoldReason'
        comment:
          type: string
        activity:
          type: string
          description: For `ACTIVITY`. Glossary `TicketActivityType`.
          enum: [CREATED, PHOTO_ADDED, TECHNICIAN_ROUTED]
        actor:
          type: object
          required: [part]
          properties:
            part:
              type: string
              description: The actor's part in this ticket.
              enum: [REQUESTER, MANAGER, TECHNICIAN, SYSTEM, OTHER]
            person:
              $ref: '#/components/schemas/PersonRef'
              description: Absent in the minimized view and for the system.

    # ---- Ticket circuit per client (H5, ADR-036) ----

    WorkflowVersionSummary:
      type: object
      required: [number, status]
      properties:
        number:
          type: integer
        status:
          type: string
          enum: [DRAFT, PUBLISHED, RETIRED]
        publishedAt:
          type: string
          format: date-time

    WorkflowSummary:
      type: object
      required: [id, code, name, ownerScope, subjectType, versions]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: default-ticket
        name:
          type: string
        ownerScope:
          type: string
          enum: [PLATFORM, ORGANIZATION, SITE]
        subjectType:
          type: string
          enum: [TICKET]
        versions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowVersionSummary'
        organizationsUsing:
          type: integer
          description: Number of organizations bound to this circuit.

    WorkflowNode:
      type: object
      required: [code, nodeType, category, label]
      properties:
        code:
          type: string
        nodeType:
          type: string
          description: '`STATE` in P1.'
        category:
          $ref: '#/components/schemas/NodeCategory'
        label:
          $ref: '#/components/schemas/LocalizedText'
        config:
          type: object
          additionalProperties: true
          description: 'For example `{"autoClose": {"transition": "auto_close"}}`.'

    WorkflowComponentRef:
      type: object
      required: [code]
      properties:
        code:
          type: string
          example: ReasonRequired
        config:
          type: object
          additionalProperties: true

    WorkflowTransition:
      type: object
      required: [code, from, to, guards, sortOrder]
      properties:
        code:
          type: string
        from:
          type: string
        to:
          type: string
        permission:
          $ref: '#/components/schemas/PermissionCode'
        guards:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowComponentRef'
        sortOrder:
          type: integer

    WorkflowVersionDetail:
      type: object
      required: [workflowId, code, name, version, nodes, transitions]
      properties:
        workflowId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        version:
          $ref: '#/components/schemas/WorkflowVersionSummary'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTransition'

    WorkflowSettings:
      description: Options of a client, read at each use (ADR-036). Glossary `WorkflowSettings`.
      type: object
      required: [requesterValidation, labels]
      properties:
        autoCloseAfterDays:
          type: integer
          minimum: 1
          maximum: 90
          description: Absent = no automatic closing (the default, H5).
        requesterValidation:
          type: boolean
          description: The requester confirms before the manager closes (H5, off by default).
        labels:
          type: object
          description: The client's labels of the steps, by step code.
          additionalProperties:
            $ref: '#/components/schemas/LocalizedTextInput'

    OrganizationWorkflow:
      type: object
      required: [organizationId, workflow, publishedVersion, chosen, settings, nodes]
      properties:
        organizationId:
          type: string
          format: uuid
        workflow:
          $ref: '#/components/schemas/WorkflowSummary'
        publishedVersion:
          type: integer
          description: Version new tickets start on.
        chosen:
          type: boolean
          description: False when the client uses the platform default without having chosen it.
        settings:
          $ref: '#/components/schemas/WorkflowSettings'
        nodes:
          type: array
          description: Steps of the published version, to edit the labels.
          items:
            $ref: '#/components/schemas/WorkflowNode'
        version:
          $ref: '#/components/schemas/Version'

    OrganizationWorkflowInput:
      type: object
      required: [workflowId, settings]
      properties:
        workflowId:
          type: string
          format: uuid
        settings:
          $ref: '#/components/schemas/WorkflowSettings'
        version:
          $ref: '#/components/schemas/Version'
          description: Absent for the first choice.
