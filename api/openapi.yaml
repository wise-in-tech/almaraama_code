                $ref: '#/components/schemas/OutdoorArea'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`VERSION_CONFLICT` or `OUTDOOR_AREA_NAME_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`OUTDOOR_AREA_HAS_ACTIVE_UNITS` when archiving.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}/units:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: listUnits
      summary: Units of a site (A6, E1)
      description: Requires `unit:read` on the site. Filtered to the buildings the caller may see (C7).
      parameters:
        - name: buildingId
          in: query
          schema:
            type: string
            format: uuid
        - name: outdoorAreaId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/UnitType'
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Part of the unit reference.
          schema:
            type: string
            maxLength: 50
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of units, ordered by reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sites]
      operationId: createUnit
      summary: Create a unit with its category (A6, A7)
      description: |
        Requires `unit:create` on the site. The category is mandatory and must belong to the unit's type and be
        usable on this site (platform default, organization's or site's own).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitInput'
      responses:
        '201':
          description: Unit created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UnitReferenceTaken'
        '422':
          $ref: '#/components/responses/UnitRuleViolated'

  /v1/units/{unitId}:
    parameters:
      - $ref: '#/components/parameters/UnitId'
    get:
      tags: [sites]
      operationId: getUnit
      summary: One unit
      description: Requires `unit:read` on the site, or an occupancy of this unit (C4).
      responses:
        '200':
          description: The unit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [sites]
      operationId: updateUnit
      summary: Update or archive a unit
      description: |
        Requires `unit:update` on its site; setting `active` to `false` also requires `unit:archive`. Never
        deleted (M2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUnitRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unit'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`VERSION_CONFLICT` or `UNIT_REFERENCE_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnitRuleViolated'

  /v1/unit-categories:
    get:
      tags: [sites]
      operationId: listUnitCategories
      summary: Unit categories usable on a site or in an organization (A6, criterion 2)
      description: |
        Requires `unit-category:read` on the given scope. With `siteId`: the platform defaults, the organization's
        categories and the site's own. With `organizationId`: the platform defaults and the organization's
        categories. Exactly one of the two is required (`VALIDATION_FAILED` otherwise).
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: organizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: unitType
          in: query
          schema:
            $ref: '#/components/schemas/UnitType'
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Categories, by unit type then sort order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnitCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sites]
      operationId: createUnitCategory
      summary: Add a category for an organization or a site (A6, criterion 2)
      description: |
        Requires `unit-category:create` on the scope: the organization (promoteur) or one site (manager). Platform
        defaults are managed with `/v1/admin/unit-categories`. For an apartment, the category is its typology.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitCategoryInput'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A category of this type already has this code in the same scope (`UNIT_CATEGORY_CODE_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`UNIT_CATEGORY_SCOPE_INVALID` (only `ORGANIZATION` or `SITE`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/unit-categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    put:
      tags: [sites]
      operationId: updateUnitCategory
      summary: Rename, reorder or archive a category
      description: |
        Requires `unit-category:update` on the category's scope; setting `active` to `false` also requires
        `unit-category:archive`. An archived category stays on the units that have it but cannot be given to new
        ones (M2). The unit type and the code cannot change. Platform defaults cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUnitCategoryRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitCategory'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: '`UNIT_CATEGORY_NOT_EDITABLE` (a platform default).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}/units/import:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      tags: [sites]
      operationId: importUnits
      summary: Import units with their category from an Excel file (A6, criterion 1, sprint 2)
      description: |
        Requires `unit:import` on the site. Accepts an `.xlsx` file built from the template (ADR-027): at most
        2 MB and 2,000 rows, first sheet only, columns found by the hidden key row so a template in any language
        works. The type is checked from the file content, not its name. Formulas are never evaluated. The file is
        never stored. 100 units are imported in a few seconds (criterion 1).

        All or nothing: with `dryRun=true`, or when any row has an error, nothing is created and the report lists
        every error by row and column. Otherwise every unit is created in one go. Buildings and outdoor areas are
        matched by name and must already exist; the category is mandatory and matched by its code (A6); `annexOf`
        may name a unit of the same file (A7).
      parameters:
        - name: dryRun
          in: query
          description: Only check the file and return the report.
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The file was read. `outcome` says whether units were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitImportReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: More than 2 MB or 2,000 rows (`IMPORT_FILE_TOO_LARGE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Not an `.xlsx` file, or not built from the template (`IMPORT_FILE_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/units/import-template:
    get:
      tags: [sites]
      operationId: downloadUnitImportTemplate
      summary: Excel template for the unit import (ADR-027)
      description: |
        Requires `unit:import` on at least one site. Column headers and instructions in the requested language;
        allowed values (types, the categories usable on the site, yes/no) offered as lists.
      parameters:
        - name: language
          in: query
          schema:
            $ref: '#/components/schemas/Language'
        - name: siteId
          in: query
          description: When given, the category list of the template is the one usable on this site.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The template.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/organizations/{organizationId}/people:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [people]
      operationId: listOrganizationPeople
      summary: People who have a role or an access in the organization
      description: Requires `account:read` on the organization.
      parameters:
        - name: q
          in: query
          description: Part of a name, of an e-mail or of a phone number.
          schema:
            type: string
            maxLength: 50
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of people, ordered by last name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPersonPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/organizations/{organizationId}/invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [people]
      operationId: inviteOrganizationPerson
      summary: Create a user account in the organization and give it roles (C8, D4, ADR-026)
      description: |
        Requires `account:create` and, for each role, the right to give it (RB-1): `role-assignment:grant` on the
        scope, or `account:invite` for a role of kind `OCCUPANT`. When the e-mail has no account, the account is
        created (`INVITED`) and a "set my password" link (7 days) is **sent to the person by e-mail**; it is never
        returned. When the e-mail already has an account, the roles apply at once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationRequest'
      responses:
        '201':
          $ref: '#/components/responses/InvitationCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`PERMISSION_DENIED`, or `ROLE_NOT_GRANTABLE` (RB-1: the caller cannot give one of the roles).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`PHONE_INVALID`, `ROLE_UNKNOWN`, `ROLE_SCOPE_INVALID`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}/invitations:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      tags: [people]
      operationId: inviteSitePerson
      summary: Create a resident's account on a site with their units (D4, E1, E5)
      description: |
        Requires `account:invite` on the site (the manager, for residents only, C9) and `occupancy:create` when
        units are given. Creates the site access with the role (`RESIDENT` by default, any role of kind
        `OCCUPANT`), active once the password is chosen, and the occupancies. Giving another kind of role needs
        `role-assignment:grant` (RB-1). The "set my password" link is sent by e-mail when the person has no account
        yet.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteInvitationRequest'
      responses:
        '201':
          $ref: '#/components/responses/InvitationCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`PERMISSION_DENIED` or `ROLE_NOT_GRANTABLE` (RB-1).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`MEMBERSHIP_EXISTS`, `OCCUPANCY_OWNER_EXISTS` (E4), `OCCUPANCY_PRIMARY_TENANT_EXISTS` (E3).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`PHONE_INVALID`, `ROLE_UNKNOWN`, `ROLE_SCOPE_INVALID`, `BUILDING_NOT_IN_SITE`, `UNIT_NOT_IN_SITE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/organizations/{organizationId}/people/{personId}/password-link:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/PersonId'
    post:
      tags: [people]
      operationId: sendPasswordLink
      summary: Send a person a new password link by e-mail (D4, D5)
      description: |
        Requires `account:invite` on a scope where the caller may give the person's roles (a manager: residents of
        their sites only, RB-1). An `INVITED` account receives a new "set my password" link (7 days); an `ACTIVE`
        account a reset link (1 hour). The previous link of the same kind stops working. The link goes to the
        person's e-mail only, never in this response. Written to the audit log. Replaces `…/reinvite`.
      responses:
        '202':
          description: E-mail on its way (unless the hourly limit is reached, see ADR-031).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordLinkSent'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            The account is deactivated (`ACCOUNT_DEACTIVATED`), or waits for its e-mail verification
            (`ACCOUNT_PENDING_VERIFICATION`: the person uses "resend the verification link").
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/roles:
    get:
      tags: [access]
      operationId: listRoles
      summary: The roles and their default permissions (C1, section 3.3, ADR-026)
      description: |
        Any signed-in person. Roles are data: the rows of the role table, with their kind, the scopes they are
        given on, and their default permissions. `ORG_ADMIN` has `grantsAll` and no list. Custom roles of an
        organization will appear here later, with their `organizationId`.
      responses:
        '200':
          description: The roles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleDefinition'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/organizations/{organizationId}/roles:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [access]
      operationId: listOrganizationRoles
      summary: The permissions of each role in this organization, and the differences from the defaults (C9, C11)
      description: Requires `permission-adjustment:manage` on the organization.
      responses:
        '200':
          description: One entry per role.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationRole'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/organizations/{organizationId}/roles/{roleCode}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RoleCodePath'
    put:
      tags: [access]
      operationId: setOrganizationRolePermissions
      summary: Change what a role can do in this organization (C9, C11)
      description: |
        Requires `permission-adjustment:manage` on the organization (only the promoteur, not delegable). The body
        is the list of permissions the role should have; the server stores only the **differences** from the
        defaults (`ADD`, `REMOVE`), so a permission added to the defaults by a later phase still reaches the role
        unless the organization removed it (C11). Person-level adjustments still apply on top. A role with
        `grantsAll` cannot be changed; non-adjustable permissions cannot be added or removed. Takes effect on the
        next request; written to the audit log (C10). The last write wins; every change is in the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRolePermissionsRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRole'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            `ROLE_NOT_EDITABLE` (`grantsAll` or platform role), `PERMISSION_NOT_ADJUSTABLE`,
            `PERMISSION_SCOPE_INVALID` (permission not usable on the scopes of this role).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/organizations/{organizationId}/roles/{roleCode}/reset:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/RoleCodePath'
    post:
      tags: [access]
      operationId: resetOrganizationRole
      summary: Go back to the default permissions for a role (C9, section 3.6)
      description: |
        Requires `permission-adjustment:manage` on the organization. Cancels every active difference of the role in
        the organization (kept with their cancellation date, M2). Written to the audit log.
      responses:
        '200':
          description: The role has the default permissions again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationRole'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`ROLE_NOT_EDITABLE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/organizations/{organizationId}/role-assignments:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [access]
      operationId: listRoleAssignments
      summary: Who holds which role in the organization and its sites
      description: Requires `account:read` on the organization, or on the site when `siteId` is given.
      parameters:
        - name: personId
          in: query
          schema:
            type: string
            format: uuid
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: roleCode
          in: query
          schema:
            $ref: '#/components/schemas/RoleCode'
        - name: includeEnded
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of role assignments, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [access]
      operationId: assignRole
      summary: Give a role to a person on the organization or one of its sites (C1, C2, C3, C8)
      description: |
        Requires `role-assignment:grant` on the scope (RB-1). The person must already have an account known to the
        organization. `SITE_MANAGER` and `TECHNICIAN` are given on a site (C2, C3); `ORG_ADMIN` on the organization
        (C8: a promoteur can name other promoteurs). Roles of kind `OCCUPANT` are normally given with the site
        access (invitation, approval). Written to the audit log (C10).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '201':
          description: Role given.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`PERMISSION_DENIED` or `ROLE_NOT_GRANTABLE` (RB-1, for example a platform role).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The person already holds this role on this scope (`ROLE_ASSIGNMENT_EXISTS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`ROLE_UNKNOWN`, `ROLE_SCOPE_INVALID` (for example `ORG_ADMIN` on a site, RB-3).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/role-assignments/{assignmentId}/end:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [access]
      operationId: endRoleAssignment
      summary: Take a role away from a person (C10, M2)
      description: |
        Requires `role-assignment:revoke` on the scope (RB-1; a role of kind `OCCUPANT` also ends with the site
        access, through `access:revoke`). The assignment is kept with its end date. Takes effect on the next
        request; written to the audit log.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            `ROLE_ASSIGNMENT_ALREADY_ENDED`, or `LAST_ORGANIZATION_ADMIN`: the organization would be left without
            any assignment of a `grantsAll` role (C8, RB-2).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/organizations/{organizationId}/people/{personId}/permissions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/PersonId'
    get:
      tags: [access]
      operationId: getPersonPermissions
      summary: What a person can do, scope by scope, and why (section 3.6)
      description: |
        Requires `account:read` on the organization. For each scope: the person's roles, each effective permission
        with its origin (role default, organization difference, person-level addition), and the permissions taken
        away (by the organization for the role, or for this person).
      responses:
        '200':
          description: The person's effective permissions in the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonPermissions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/organizations/{organizationId}/permission-adjustments:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [access]
      operationId: adjustPersonPermission
      summary: Add a permission to one person, or remove one of their role's permissions (C9)
      description: |
        Requires `permission-adjustment:manage` on the organization (only the promoteur, not delegable). `ADD` gives
        the person a permission their roles do not give; `REMOVE` takes away a permission their role gives, for this
        person only. The person must hold a role on the scope (RB-3). Non-adjustable permissions and people holding
        a `grantsAll` role cannot be adjusted. Takes effect on the next request; written to the audit log (C10).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionAdjustmentRequest'
      responses:
        '201':
          description: Adjustment recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionAdjustment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The same adjustment is already active (`PERMISSION_ADJUSTMENT_EXISTS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `PERMISSION_NOT_ADJUSTABLE`, `PERMISSION_SCOPE_INVALID`, `PERSON_HAS_NO_ROLE_ON_SCOPE`,
            `PERMISSION_ADJUSTMENT_USELESS` (adding a permission the roles already give, or removing one they do not
            give), `ROLE_NOT_EDITABLE` (a person holding a `grantsAll` role on the organization).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/permission-adjustments/{adjustmentId}/cancel:
    parameters:
      - name: adjustmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [access]
      operationId: cancelPermissionAdjustment
      summary: Cancel a person-level adjustment; the role's permissions apply again (M2)
      description: Requires `permission-adjustment:manage` on the organization. Kept with its cancellation date; audited.
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionAdjustment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`PERMISSION_ADJUSTMENT_ALREADY_CANCELLED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}/memberships:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [memberships]
      operationId: listSiteMemberships
      summary: People who have, or ask for, an access to the site (D2, C7)
      description: |
        Requires `account:read` on the site. `status=PENDING` lists the requests waiting for a decision (D2): only
        submitted ones, that is with a verified e-mail (ADR-034). A request that was never submitted appears
        nowhere.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MembershipStatus'
        - name: q
          in: query
          description: Part of a name, of an e-mail or of a phone number.
          schema:
            type: string
            maxLength: 50
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of site accesses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMembershipPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/site-memberships/{membershipId}/approve:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    post:
      tags: [memberships]
      operationId: approveMembership
      summary: Approve an access request and give the units (D2 step 3, E5)
      description: |
        Requires `access:approve` on the site, and `occupancy:create` when units are given. Opens the access to the
        chosen buildings (C7; empty = the buildings of the given units), gives the `RESIDENT` role on the site and
        records the occupancies the approver chose from the person's comment (several apartments, parkings and
        storage rooms, A7), each as owner or tenant (E2 to E4). The person is notified (`ACCESS_APPROVED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveMembershipRequest'
      responses:
        '200':
          description: Approved; the access is `ACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMembership'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`VERSION_CONFLICT`, `OCCUPANCY_OWNER_EXISTS` (E4), `OCCUPANCY_PRIMARY_TENANT_EXISTS` (E3).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`MEMBERSHIP_NOT_PENDING`, `BUILDING_NOT_IN_SITE`, `UNIT_NOT_IN_SITE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/site-memberships/{membershipId}/reject:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    post:
      tags: [memberships]
      operationId: rejectMembership
      summary: Refuse an access request (D2)
      description: |
        Requires `access:refuse` on the site. The request is kept as `REJECTED` (M2); the person is notified
        (`ACCESS_REJECTED`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMembership'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`MEMBERSHIP_NOT_PENDING`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/site-memberships/{membershipId}/allowed-buildings:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    put:
      tags: [memberships]
      operationId: setAllowedBuildings
      summary: Restrict a person to some buildings of the site (C7)
      description: |
        Requires `access:restrict` on the site. An empty list means every building of the site. By default, a
        resident is limited to the buildings of their units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowedBuildingsRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMembership'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: '`BUILDING_NOT_IN_SITE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/site-memberships/{membershipId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    post:
      tags: [memberships]
      operationId: deactivateMembership
      summary: End a person's access to the site (D6, M2)
      description: Requires `access:revoke` on the site. The access, its roles and its history are kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMembership'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`MEMBERSHIP_NOT_ACTIVE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/site-memberships/{membershipId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    post:
      tags: [memberships]
      operationId: reactivateMembership
      summary: Give back a deactivated access
      description: Requires `access:approve` on the site.
      responses:
        '200':
          description: Active again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMembership'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`MEMBERSHIP_NOT_DEACTIVATED`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}/registration-qr:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [registration]
      operationId: getRegistrationQr
      summary: The site's registration QR code, to show, download or print (D2, criterion 4)
      description: |
        Requires `registration-qr:read` on the site (promoteur and manager). The application draws the QR code from
        `registrationUrl` (SVG and PNG download, A4 print page); the server produces no image (ADR-034).
      responses:
        '200':
          description: The registration QR code.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationQr'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [registration]
      operationId: setRegistrationQrEnabled
      summary: Activate or deactivate the registration QR code (D2, criterion 4)
      description: |
        Requires `registration-qr:manage` on the site (the promoteur by default, section 3.3). A deactivated code
        answers exactly like an unknown one. Requests already sent are not affected. Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationQrSettings'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationQr'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/sites/{siteId}/registration-qr/rotate:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      tags: [registration]
      operationId: rotateRegistrationQr
      summary: Replace the registration QR code; the old one stops working at once (D2, criterion 4)
      description: |
        Requires `registration-qr:manage` on the site. For a code that was shared too widely or printed by
        mistake. The new code is active. Written to the audit log.
      responses:
        '200':
          description: The new registration QR code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationQr'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/registration-qr/inspect:
    post:
      tags: [registration]
      operationId: inspectRegistrationCode
      summary: Check a registration code before filling in the form (D2)
      description: |
        Public, rate limited. Returns only the names of the site and its organization, so the person knows where
        they are registering. The list of sites is never public (D2). Unknown, replaced and deactivated codes give
        the same `REGISTRATION_CODE_INVALID` answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCodeRequest'
      responses:
        '200':
          description: The code opens registration on this site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationQrPreview'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/RegistrationCodeInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/registrations:
    post:
      tags: [registration]
      operationId: register
      summary: Register on a site with its QR code (D2, D3, criteria 5 and 6)
      description: |
        Public, protected by ALTCHA (ADR-032) and rate limited. Always answers `202` with the same body when the
        code is valid and the fields are correct, **whether the e-mail already has an account or not**, so the
        form reveals nothing (ADR-034):

        - e-mail without an account: the account is created (`PENDING_VERIFICATION`) with the chosen password, a
          "verify my e-mail" link is sent (48 hours), and a `PENDING` access request is recorded with the comment.
          The request reaches the manager (K1) only once the e-mail is verified; then, if a pre-registration of
          this site matches the key **and** the e-mail, it is approved automatically with the planned units (D3);
        - e-mail with an account: nothing changes; the person receives an e-mail telling them to sign in and scan
          the code again (`POST /v1/me/access-requests`), or to reset their password.

        A wrong, expired or used key gives no error: the request follows the manual approval. Until approval the
        person sees nothing of the site (D2 step 4).
      security: []
      parameters:
        - $ref: '#/components/parameters/AltchaHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '202':
          description: Accepted. The person checks their mailbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
        '400':
          description: '`VALIDATION_FAILED`, `ALTCHA_INVALID`, or a refused password (`PASSWORD_TOO_SHORT`, `PASSWORD_TOO_LONG`, `PASSWORD_TOO_COMMON`, `PASSWORD_SAME_AS_EMAIL`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/RegistrationCodeInvalid'
        '422':
          description: '`PHONE_INVALID`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/sites/{siteId}/pre-registrations:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [pre-registrations]
      operationId: listPreRegistrations
      summary: Pre-registrations of the site (D3)
      description: Requires `pre-registration:read` on the site. Keys are never returned here.
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/PreRegistrationStatus'
        - name: q
          in: query
          description: Part of a name or of an e-mail.
          schema:
            type: string
            maxLength: 50
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of pre-registrations, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreRegistrationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [pre-registrations]
      operationId: createPreRegistration
      summary: Pre-register an expected person with their planned units (D3, criterion 6)
      description: |
        Requires `pre-registration:create` and `occupancy:create` on the site (promoteur and manager). Returns the
        personal key **once**: give it to the person by the means of your choice (D3); it is never shown again
        (renew it if lost). Valid `keyValidDays` days (30 by default), single use. No account is created and no
        e-mail is sent: the person registers with the site's QR code, the key and this e-mail.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreRegistrationRequest'
      responses:
        '201':
          description: Pre-registration created, with its key.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreRegistrationIssued'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `PRE_REGISTRATION_EXISTS` (one pending pre-registration per e-mail and site), `OCCUPANCY_OWNER_EXISTS`
            (E4: the unit has an active owner, or one planned in another pending pre-registration),
            `OCCUPANCY_PRIMARY_TENANT_EXISTS` (E3), `MEMBERSHIP_EXISTS` (the e-mail already has an access to this
            site: give the units directly).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`PHONE_INVALID`, `UNIT_NOT_IN_SITE`, `UNIT_ARCHIVED`, `OCCUPANCY_PRIMARY_TENANT_NOT_TENANT`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/pre-registrations/{preRegistrationId}:
    parameters:
      - $ref: '#/components/parameters/PreRegistrationId'
    get:
      tags: [pre-registrations]
      operationId: getPreRegistration
      summary: One pre-registration, without its key (D3)
      description: Requires `pre-registration:read` on its site.
      responses:
        '200':
          description: The pre-registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreRegistration'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/pre-registrations/{preRegistrationId}/renew-key:
    parameters:
      - $ref: '#/components/parameters/PreRegistrationId'
    post:
      tags: [pre-registrations]
      operationId: renewPreRegistrationKey
      summary: Give a new key to a pending pre-registration; the old key stops working (D3)
      description: |
        Requires `pre-registration:create` on its site. For a lost key. The new key is returned once and is valid
        `keyValidDays` days from now. Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewPreRegistrationKeyRequest'
      responses:
        '200':
          description: The new key.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreRegistrationIssued'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: '`PRE_REGISTRATION_NOT_PENDING` (used or cancelled; an expired one can be renewed).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/pre-registrations/{preRegistrationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/PreRegistrationId'
    post:
      tags: [pre-registrations]
      operationId: cancelPreRegistration
      summary: Cancel a pending pre-registration (D3, M2)
      description: |
        Requires `pre-registration:cancel` on its site. The key stops working; the pre-registration is kept as
        `CANCELLED`. Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreRegistration'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`PRE_REGISTRATION_NOT_PENDING`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}/residents/import:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      tags: [pre-registrations]
      operationId: importResidents
      summary: Import residents as pre-registrations from an Excel file (D3, ADR-027)
      description: |
        Requires `pre-registration:create` and `occupancy:create` on the site. Same file rules as the unit import
        (ADR-027: `.xlsx` built from the template, 2 MB, 2,000 rows, type checked by content, never stored). One row
        per planned unit; the rows of one e-mail make one pre-registration, whose name, phone and language must be
        the same on every row (`IMPORT_PERSON_MISMATCH`).

        All or nothing, like the unit import. When `outcome` is `IMPORTED`, the response carries every key
        **once** (`keys`): print them or download them as CSV and give them to the people; they are never shown
        again.
      parameters:
        - name: dryRun
          in: query
          description: Only check the file and return the report.
          schema:
            type: boolean
            default: false
        - name: keyValidDays
          in: query
          description: Validity of the keys (D3, 30 days by default).
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: The file was read. `outcome` says whether pre-registrations were created.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentImportReport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: More than 2 MB or 2,000 rows (`IMPORT_FILE_TOO_LARGE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Not an `.xlsx` file, or not built from the template (`IMPORT_FILE_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/residents/import-template:
    get:
      tags: [pre-registrations]
      operationId: downloadResidentImportTemplate
      summary: Excel template for the resident import (ADR-027)
      description: |
        Requires `pre-registration:create` on at least one site. Column headers and instructions in the requested
        language; languages, occupancy roles and yes/no offered as lists.
      parameters:
        - name: language
          in: query
          schema:
            $ref: '#/components/schemas/Language'
      responses:
        '200':
          description: The template.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/units/{unitId}/occupancies:
    parameters:
      - $ref: '#/components/parameters/UnitId'
    get:
      tags: [occupancies]
      operationId: listUnitOccupancies
      summary: Occupants of a unit (E2, E4)
      description: Requires `occupancy:read` on the site.
      parameters:
        - name: includeEnded
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Occupancies, current ones first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Occupancy'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [occupancies]
      operationId: startOccupancy
      summary: Give a unit to a person (E1 to E5, criterion 15)
      description: |
        Requires `occupancy:create` on the site. The person must have an access to the site. A unit has at most
        one active owner (E4) and at most one active primary tenant (E3).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartOccupancyRequest'
      responses:
        '201':
          description: Occupancy started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occupancy'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`OCCUPANCY_OWNER_EXISTS` (E4), `OCCUPANCY_PRIMARY_TENANT_EXISTS` (E3), `OCCUPANCY_EXISTS`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`PERSON_NOT_MEMBER_OF_SITE`, `OCCUPANCY_PRIMARY_TENANT_NOT_TENANT`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/occupancies/{occupancyId}/end:
    parameters:
      - name: occupancyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [occupancies]
      operationId: endOccupancy
      summary: End an occupancy (E2, M2)
      description: Requires `occupancy:end` on the site. The occupancy is kept with its end date and reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndOccupancyRequest'
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Occupancy'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`OCCUPANCY_ALREADY_ENDED`, `OCCUPANCY_END_BEFORE_START`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: My notifications, newest first (K1)
      parameters:
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: countUnreadNotifications
      summary: Number of unread notifications, for the bell
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [notifications]
      operationId: markNotificationRead
      summary: Mark one notification as read
      responses:
        '204':
          description: Marked as read (also when it already was).
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      summary: Mark all my notifications as read
      responses:
        '204':
          description: Done.
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/texts/{language}:
    parameters:
      - $ref: '#/components/parameters/LanguagePath'
    get:
      tags: [texts]
      operationId: getTexts
      summary: Every interface text of one language (M6, criterion 20)
      description: |
        Public, read only, rate limited (60 per minute per address). About 15 KB compressed. The application ships
        its own copy for the first display, keeps the last answer locally and revalidates in the background at
        start, when it comes back to the foreground and every 15 minutes, sending `If-None-Match` (ADR-029). Keys
        made obsolete by a release are not sent.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        '200':
          description: The texts.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextBundle'
        '304':
          description: Nothing changed since the given `ETag`.
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/admin/texts:
    get:
      tags: [texts, admin]
      operationId: searchTexts
      summary: Search the dictionary, the three languages side by side (M6)
      description: Requires `text:read` on the platform.
      parameters:
        - name: q
          in: query
          description: Part of a key or of a text, in any language.
          schema:
            type: string
            maxLength: 100
        - name: missingIn
          in: query
          description: Only keys without a text in this language.
          schema:
            $ref: '#/components/schemas/Language'
        - name: editedOnly
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of keys, ordered by key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextRowPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/admin/texts/{key}/{language}:
    parameters:
      - $ref: '#/components/parameters/TextKey'
      - $ref: '#/components/parameters/LanguagePath'
    put:
      tags: [texts, admin]
      operationId: updateText
      summary: Change one text; visible without deployment (M6, criterion 20)
      description: |
        Requires `text:update` on the platform. The text becomes `EDITED`: a later release never overwrites it
        (ADR-029). Plain text only, shown as text by the application. A revision is recorded and the change is
        written to the audit log; the public bundle changes its `ETag` at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTextRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextValue'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          description: Unknown or obsolete key (`NOT_FOUND`). Keys come from the developers, never from this screen.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: |
            `TEXT_VARIABLES_CHANGED`: the text must keep exactly the `{{name}}` variables of the delivered text of
            this key (none added, none removed).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/texts/{key}/revisions:
    parameters:
      - $ref: '#/components/parameters/TextKey'
    get:
      tags: [texts, admin]
      operationId: listTextRevisions
      summary: History of one key, every language, newest first (M6, M2)
      description: Requires `text:read` on the platform.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of revisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextRevisionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/admin/text-revisions/{revisionId}/restore:
    parameters:
      - name: revisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [texts, admin]
      operationId: restoreTextRevision
      summary: Put back the text a revision had (rollback, M2)
      description: |
        Requires `text:update` on the platform. Records a new revision with the old text (nothing is erased). The
        restored text is `EDITED`, unless it equals the delivered text, which makes it `SEED` again.
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextValue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`TEXT_VARIABLES_CHANGED` (the delivered text changed its variables since that revision).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/organizations:
    get:
      tags: [admin, organizations]
      operationId: listAllOrganizations
      summary: Every client organization, for the back-office (C12)
      description: |
        Requires `organization:read` on the platform. Counters only, never the organization's people or units.
        Creating an organization stays `POST /v1/organizations`.
      parameters:
        - name: q
          in: query
          description: Part of the name.
          schema:
            type: string
            maxLength: 100
        - name: active
          in: query
          schema:
            type: boolean
        - name: countryCode
          in: query
          schema:
            $ref: '#/components/schemas/CountryCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of organizations, ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganizationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'

  /v1/admin/organizations/{organizationId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [admin, organizations]
      operationId: deactivateOrganization
      summary: Deactivate an organization; its people lose access to it at their next request (C12, M2)
      description: |
        Requires `organization:deactivate` on the platform. Nothing is deleted: roles, accesses and data stay and
        come back with `reactivate`. Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequiredReasonRequest'
      responses:
        '200':
          description: Deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`ORGANIZATION_NOT_ACTIVE`, `SUPPORT_SESSION_OPEN` (end the support sessions first).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/organizations/{organizationId}/reactivate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [admin, organizations]
      operationId: reactivateOrganization
      summary: Give an organization back its access (C12)
      description: Requires `organization:deactivate` on the platform. Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequiredReasonRequest'
      responses:
        '200':
          description: Active again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrganization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`ORGANIZATION_ALREADY_ACTIVE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/organizations/{organizationId}/owner-invitations:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [admin, organizations]
      operationId: inviteOrganizationOwner
      summary: Invite one more promoteur to an organization (C8, C12)
      description: |
        Requires `organization:create` on the platform. Gives the `ORG_ADMIN` role on the organization (for
        example when the first promoteur left). A new account receives a "set my password" link by e-mail; an
        existing account gets the role at once. Written to the audit log.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonInput'
      responses:
        '201':
          $ref: '#/components/responses/InvitationCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The person already is a promoteur of this organization (`ROLE_ASSIGNMENT_EXISTS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`PHONE_INVALID`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/zones:
    get:
      tags: [admin, reference]
      operationId: searchAdminZones
      summary: Zones of every status, for the back-office (A8)
      description: |
        Requires `reference-data:read` on the platform. Unlike the reference endpoints, lists provisional zones
        of every organization and deactivated zones, with the number of active addresses using each zone.
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CountryCode'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ZoneStatus'
        - name: parentId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 50
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of zones, by code (filter `status=PROVISIONAL` for the zones waiting for a decision).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminZonePage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [admin, reference]
      operationId: createZone
      summary: Add a validated zone to the tree (A8, M7)
      description: |
        Requires `reference-data:create` on the platform. For corrections and additions; the bulk loading of a
        country is done directly in the database (ADR-035). The level is the parent's plus one (1 without parent).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
      responses:
        '201':
          description: Zone created (`VALIDATED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminZone'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ZONE_CODE_TAKEN` (same code under the same parent), `ZONE_NAME_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`COUNTRY_UNKNOWN`, `ZONE_LEVEL_INVALID` (deeper than the country''s levels), `ZONE_PARENT_INVALID` (deactivated or of another country).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/zones/{zoneId}:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    put:
      tags: [admin, reference]
      operationId: updateZone
      summary: Correct the names or the code of a zone (A8)
      description: Requires `reference-data:update` on the platform. The parent and the level do not change here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateZoneRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminZone'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`VERSION_CONFLICT`, `ZONE_CODE_TAKEN`, `ZONE_NAME_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/zones/{zoneId}/validate:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    post:
      tags: [admin, reference]
      operationId: validateProvisionalZone
      summary: Validate a provisional zone, keeping it and its addresses (A8, criterion 3)
      description: |
        Requires `reference-data:validate-provisional` on the platform. Sets its final code and, when needed, its
        parent (the materialized path of the zone is recomputed). Written to the audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateZoneRequest'
      responses:
        '200':
          description: Validated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminZone'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`VERSION_CONFLICT`, `ZONE_CODE_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`ZONE_NOT_PROVISIONAL`, `ZONE_PARENT_LEVEL_INVALID`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/zones/{zoneId}/merge:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    post:
      tags: [admin, reference]
      operationId: mergeProvisionalZone
      summary: Merge a provisional zone into a validated zone (A8, M2)
      description: |
        Requires `reference-data:validate-provisional` on the platform. Every active address of the provisional
        zone is replaced by the same address in the target zone (old rows kept); the provisional zone becomes
        `DEACTIVATED` with `mergedInto`. Written to the audit log (ADR-035).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeZoneRequest'
      responses:
        '200':
          description: Merged. The answer is the deactivated provisional zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminZone'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: '`ZONE_NOT_PROVISIONAL`, `ZONE_MERGE_TARGET_INVALID` (not validated, another country or another level).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/zones/{zoneId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    post:
      tags: [admin, reference]
      operationId: deactivateZone
      summary: Deactivate a zone; it is kept, no longer offered (A8, M2)
      description: |
        Requires `reference-data:archive` on the platform. Existing addresses keep it. Refused while it has active
        children or provisional zones waiting under it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedReasonRequest'
      responses:
        '200':
          description: Deactivated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminZone'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          description: '`ZONE_ALREADY_DEACTIVATED`, `ZONE_HAS_ACTIVE_CHILDREN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/unit-categories:
    get:
      tags: [admin, sites]
      operationId: listPlatformUnitCategories
