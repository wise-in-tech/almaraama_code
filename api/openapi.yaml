  /v1/admin/unit-categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    put:
      tags: [admin, sites]
      operationId: updatePlatformUnitCategory
      summary: Rename, reorder or archive a default category (A6, M2)
      description: |
        Requires `reference-data:update` on the platform; setting `active` to `false` also requires
        `reference-data:archive`. An archived category stays on the units that have it.
      requestBody:
        required: true
        content:
          application/json:
