                items:
                  $ref: '#/components/schemas/AssetFamily'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [assets]
      operationId: createAssetFamily
      summary: Add a family for the organization (G1, M7)
      description: |
        Requires `asset:create` on the organization or on one of its sites (the manager completes the defaults, G1).
        The family is visible only to this organization.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetFamilyInput'
