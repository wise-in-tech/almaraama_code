  /v1/admin/support-sessions:
    get:
      tags: [admin]
      operationId: listSupportSessions
      summary: Support sessions, newest first (C12)
      description: Requires `support:access` on the platform. Every administrator's sessions.
      parameters:
        - name: organizationId
          in: query
          schema:
            type: string
            format: uuid
        - name: openOnly
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of support sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSessionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
    post:
      tags: [admin]
      operationId: startSupportSession
      summary: Open a support session on one organization, with a reason, for 1 hour (C12, ADR-035)
      description: |
        Requires `support:access` on the platform. During the session the administrator has, on this organization
        and its sites only, the permissions of the promoteur (read and write); the coded rules still apply (M3,
        C6, J3, M2). Every action carries the session in the audit log. Opening a session ends the caller's
        previous one. `GET /v1/me/access` shows the open session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSupportSessionRequest'
      responses:
        '201':
          description: Session open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`ORGANIZATION_NOT_ACTIVE`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/admin/support-sessions/{supportSessionId}/end:
    parameters:
      - $ref: '#/components/parameters/SupportSessionId'
    post:
      tags: [admin]
      operationId: endSupportSession
      summary: End a support session before its hour is over (C12)
      description: |
        Requires `support:access` on the platform; only the administrator who opened it. The access stops at the
        next request. Ending an ended or expired session changes nothing.
      responses:
        '200':
          description: Ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'

  # =====================================================================================================
  # Sprint 3: files (ADR-038)
  # =====================================================================================================

  /v1/files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Upload a ticket photo or an equipment document (H10, G3, ADR-038)
      description: |
        Requires a session and at least one site in the caller's perimeter; at most 30 uploads per minute per person.
        The type is detected from the content (JPEG, PNG, PDF), never from the name or the declared type. Photos are
        re-encoded as JPEG (at most 2,048 pixels, metadata such as the GPS position removed); PDF files are kept as
        they are and never interpreted by the server. The application shrinks photos before sending them.

        The returned file can be used **once**, **by the uploader only**, within **24 hours**, for its `purpose`
        (`FILE_NOT_USABLE` otherwise): the owning endpoint (ticket, equipment) attaches it after checking its own
        permissions. There is no "give me a link" endpoint: links come inside the owner's responses.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  $ref: '#/components/schemas/FilePurpose'
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '413':
          description: |
            Larger than allowed for the purpose (`TOO_LARGE`: 8 MB for a photo, 10 MB for a document), or an image
            above 40 megapixels or 10,000 pixels on a side (`IMAGE_TOO_LARGE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: Content not accepted for this purpose, or unreadable image (`UNSUPPORTED_CONTENT`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/files/{fileId}/content:
    parameters:
      - $ref: '#/components/parameters/FileId'
    get:
      tags: [files]
      operationId: downloadFile
      summary: Read a file through a signed link (ADR-038)
      description: |
        Public: the signature protects the file, so that an `<img>` tag works without the access token. Links are
        built by the owning endpoints (ticket photos, equipment documents) after their own visibility check, and
        are valid **5 minutes**. A wrong or expired signature gives `404`. Images are served `inline`, PDF files as
        `attachment`; responses carry `X-Content-Type-Options: nosniff`, `Content-Security-Policy: sandbox` and
        `Cache-Control: private, max-age=300`.
      security: []
      parameters:
        - name: expires
          in: query
          required: true
          description: Expiry, in seconds since 1970.
          schema:
            type: integer
            format: int64
        - name: signature
          in: query
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '200':
          description: The file.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  # =====================================================================================================
  # Sprint 3: equipment (G1 to G4, ADR-039)
  # =====================================================================================================

  /v1/organizations/{organizationId}/asset-families:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [assets]
      operationId: listAssetFamilies
      summary: Equipment families and their models usable by an organization (G1, M7)
      description: |
        Requires `asset:read` on the organization or on one of its sites. The platform defaults first, then the
        organization's own families. Each family lists its models.
      parameters:
