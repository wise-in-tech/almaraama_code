openapi: 3.1.0
info:
  title: almaraama API
  version: 0.6.1
  description: |
    Public API of the almaraama platform.

    Contract first: this file is the single source of truth. The backend implements it and is tested against it;
    the frontend generates its types and client from it, and mocks it while an endpoint is not implemented yet.
    Names, paths, fields and error codes are in English (see docs/glossary.md). Spec rules (v3.4) are cited by
    number.

    **Authentication (ADR-030, replaces ADR-025):** e-mail and password. The e-mail is the sign-in identifier and is
    verified by a link before the first sign-in (D1); an account created by a manager receives a "set my password"
    link valid 7 days, which also verifies the e-mail (D4). Forgotten password: a link by e-mail (D5). No SMS is ever
    sent. Links carry their secret after `#`; the secret travels in request bodies, never in a URL path, and is
    never returned by the API. A short-lived access token (JWT) is returned in the response body and kept in memory
    by the client. The refresh token is an HttpOnly cookie restricted to `/api/v1/auth`, rotated at every use; the
    endpoints that read it require the `X-Almaraama-Csrf` header.

    **Authorization (ADR-026, revision 2):** roles are data (`ORG_ADMIN`, `SITE_MANAGER`, `TECHNICIAN`,
    `RESIDENT`… are the first rows). A role is given to a person on an organization or a site and comes with
    default permissions (`resource:action`, specification section 3.3). The organization's promoteur can add or
    remove permissions for a role (stored as differences from the defaults, C11) or for one person (C9). The server
    checks a permission on every request, never a role name. An object outside the perimeter gives
    `404 NOT_FOUND`; an object in the perimeter without the permission gives `403 PERMISSION_DENIED`.

    **Public forms (ADR-032):** the public endpoints that send an e-mail require an ALTCHA proof of work in the
    `X-Altcha` header.

    **Registration (ADR-034, sprint 2):** each site has a registration QR code managed by the promoteur. A person
    scans it, gives their details, a free comment and a password; the request reaches the manager once the e-mail is
    verified. A pre-registration key with the matching e-mail approves the request automatically (D3). Keys and codes
    are never logged; a pre-registration key is returned once, at creation.

    **Back-office (ADR-035, sprint 2):** endpoints under `/v1/admin` need platform permissions. A platform
    administrator sees an organization's data only through a support session (reason, 1 hour, every action logged
    with the session).

    **Texts (ADR-029, sprint 2):** the interface texts are a dictionary the administrators edit without deployment;
    `GET /v1/texts/{language}` is public and supports `ETag` / `If-None-Match`.

    **Equipment, files and tickets (sprint 3, ADR-036 to ADR-039):** equipment belongs to a family and a model
    and carries a QR code that opens a prefilled ticket form (G1 to G4). Files are uploaded first, checked by their
    content, photos re-encoded; they are read through signed links valid 5 minutes, built by the owning endpoint
    after its own visibility check. A ticket follows its organization's circuit (data, versioned); the client's
    options (auto-close, requester validation, labels) apply at once. Ticket visibility comes from relationships
    (requester, occupant of the unit, member of the site for common tickets, assigned technician) widened by
    `ticket:read` and `ticket:read-private` (ADR-037).

    **Support (ADR-033):** every response carries an `X-Request-Id` header, also present in error bodies as
    `requestId`. Quote it to find the request in the logs.
servers:
  - url: /api
security:
  - bearerAuth: []

tags:
  - name: invitations
    description: '"Set my password" links of accounts created by a manager (D4).'
  - name: auth
    description: Sign-in, session renewal, sign-out and forgotten password (D5).
  - name: accounts
    description: E-mail verification (D1).
  - name: altcha
    description: Anti-robot challenges for public forms (ADR-032).
  - name: me
    description: The signed-in person.
  - name: reference
    description: Reference data (countries and the zone tree, A8).
  - name: organizations
    description: Client organizations (promoteurs and single residences in P1).
  - name: sites
    description: Sites, buildings, outdoor areas, units and unit categories (A1 to A9).
  - name: people
    description: User accounts created by an organization (D4).
  - name: access
    description: Roles, their default permissions, organization differences and person-level adjustments (ADR-026).
  - name: memberships
    description: Access of a person to a site, decisions on requests, building restriction (D2, C7).
  - name: registration
    description: Registration QR code of a site and public registration form (D2, ADR-034).
  - name: pre-registrations
    description: Expected people with their planned units and a single-use key (D3, ADR-034).
  - name: occupancies
    description: Units given to people (E1 to E5).
  - name: notifications
    description: In-application notifications (K1).
  - name: texts
    description: Text dictionary of the interface (M6, ADR-029).
  - name: admin
    description: Back-office of the platform administrators (C12, ADR-035).
  - name: files
    description: Upload of photos and documents, reading through signed links (ADR-038).
  - name: assets
    description: Equipment families and models, equipment, suppliers, documents, warranties, QR codes (G1 to G4).
  - name: tickets
    description: Issue categories and types, routing, tickets, their steps and history (H1 to H10).
  - name: workflow
    description: Ticket circuit of each client (H5, ADR-036).

paths:
  /v1/invitations/inspect:
    post:
      tags: [invitations]
      operationId: inspectInvitation
      summary: Check a "set my password" link before choosing a password (D4)
      description: |
        Returns the first name, e-mail and language of the invited person, so the screen can greet them and show
        which account they are creating. Unknown, expired and already used links all give the same
        `LINK_INVALID_OR_EXPIRED` answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenRequest'
      responses:
        '200':
          description: The link can be used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/LinkInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/invitations/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: Choose a password and sign in for the first time (D4, D5)
      description: |
        Sets the person's password, marks the e-mail as verified (the link proved the person reads this mailbox),
        activates the account and opens a session on this device. The link cannot be used again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionOpened'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/LinkInvalid'
        '422':
          $ref: '#/components/responses/PasswordRejected'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with e-mail and password (D5)
      description: |
        An unknown e-mail, a wrong password and a deactivated account give the same `AUTH_INVALID_CREDENTIALS`
        answer, in the same time. After 4 failed attempts the sign-in is locked for a growing duration
        (`AUTH_TEMPORARILY_LOCKED`). `EMAIL_NOT_VERIFIED` is returned only after a correct password, so it never
        reveals whether an account exists; the application then offers to resend the verification link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionOpened'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Wrong e-mail or password (`AUTH_INVALID_CREDENTIALS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Correct password, but the e-mail is not verified yet (`EMAIL_NOT_VERIFIED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: |
            Too many failed attempts (`AUTH_TEMPORARILY_LOCKED`, with `retryAfterSeconds`) or too many requests
            from this client (`RATE_LIMITED`).
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Get a new access token
      description: |
        Uses the refresh cookie, then replaces it with a new one. Presenting a refresh token that was already used
        ends the session on that device (theft detection). Sessions closed by a password reset are refused.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/SessionOpened'
        '401':
          description: No valid session on this device (`SESSION_INVALID`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/CsrfHeaderMissing'

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out on this device
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session ended and refresh cookie cleared.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
        '403':
          $ref: '#/components/responses/CsrfHeaderMissing'

  /v1/auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Forgotten password - send a reset link by e-mail (D5)
      description: |
        Public, protected by ALTCHA (ADR-032). Always answers `202`, whatever the e-mail, so it reveals nothing.
        An `ACTIVE` account receives a reset link valid 1 hour; an `INVITED` account receives a new "set my
        password" link (7 days). Previous links of the same kind stop working. At most 3 e-mails per hour for one
        person and one kind of link (ADR-031); beyond that nothing is sent.
      security: []
      parameters:
        - $ref: '#/components/parameters/AltchaHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted. If an account matches, an e-mail is on its way.
        '400':
          description: '`VALIDATION_FAILED`, or a missing, invalid, expired or reused ALTCHA proof (`ALTCHA_INVALID`).'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Choose a new password with a reset link (D5)
      description: |
        Replaces the password, marks the e-mail as verified, clears the sign-in lock and **ends every session of
        the person on every device** (ASVS V3.3.3). An e-mail tells the person their password was changed. No
        session is opened: the person signs in with the new password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/LinkInvalid'
        '422':
          $ref: '#/components/responses/PasswordRejected'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/accounts/verify-email:
    post:
      tags: [accounts]
      operationId: verifyEmail
      summary: Verify the e-mail address with the link received (D1)
      description: |
        Marks the e-mail as verified and activates an account waiting for it (`PENDING_VERIFICATION` →
        `ACTIVE`). No session is opened. A link already used, unknown or expired gives `LINK_INVALID_OR_EXPIRED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkTokenRequest'
      responses:
        '204':
          description: E-mail verified.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/LinkInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/accounts/verify-email/resend:
    post:
      tags: [accounts]
      operationId: resendEmailVerification
      summary: Send the verification link again (D1)
      description: |
        Public, protected by ALTCHA (ADR-032). Always answers `202`. Sends a new link (48 hours) only when an
        account with this e-mail waits for its verification; the previous link stops working. At most 3 e-mails
        per hour (ADR-031).
      security: []
      parameters:
        - $ref: '#/components/parameters/AltchaHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          description: '`VALIDATION_FAILED` or `ALTCHA_INVALID`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/altcha/challenge:
    get:
      tags: [altcha]
      operationId: getAltchaChallenge
      summary: A new anti-robot challenge (ADR-032)
      description: |
        Public. A signed proof-of-work challenge, valid 10 minutes and usable once. The ALTCHA widget solves it
        (about one second on an entry-level phone) and the form sends the solution in the `X-Altcha` header.
      security: []
      responses:
        '200':
          description: The challenge.
          headers:
            Cache-Control:
              description: '`no-store`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AltchaChallenge'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in person
      responses:
        '200':
          description: Profile of the signed-in person (D1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me/access:
    get:
      tags: [me]
      operationId: getMyAccess
      summary: What the signed-in person can see and do
      description: |
        Organizations and sites in the person's perimeter, with the effective permissions on each (ADR-026).
        The application uses it to build its menus. The server still checks every request: this list is a
        convenience, never a source of authority.
      responses:
        '200':
          description: The person's access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me/memberships:
    get:
      tags: [me]
      operationId: listMyMemberships
      summary: My site accesses and their status (D2, D6)
      description: Every site access of the person, pending ones included, with the units they occupy (E1).
      responses:
        '200':
          description: The person's site accesses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyMembership'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/me/access-requests:
    post:
      tags: [me, registration]
      operationId: requestSiteAccess
      summary: Ask for access to one more site with its registration QR code (D2 step 5, D6)
      description: |
        For a person who already has an account (signed in): joins another site by its registration code, with a
        free comment and, optionally, a pre-registration key. Open to every signed-in person (`access:request` is
        not a role permission, section 3.3). No ALTCHA: the session is enough. The request is submitted at once
        (the e-mail is already verified): with a matching key and e-mail it is approved automatically with the
        planned units (D3, origin `PRE_REGISTRATION`); otherwise it stays `PENDING` until a person holding
        `access:approve` on the site decides, and they are notified (K1). A wrong key gives no error: the request
        simply follows the manual approval.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteAccessRequest'
      responses:
        '201':
          description: Request recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyMembership'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/RegistrationCodeInvalid'
        '409':
          description: The person already has an access to this site, pending or active (`MEMBERSHIP_EXISTS`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/reference/countries:
    get:
      tags: [reference]
      operationId: listCountries
      summary: Countries loaded in the reference data, with their parameters (A8, M4, M5)
      description: |
        Any signed-in person. Each country is a set of parameters: named administrative levels, the attachment
        level of addresses ("city"), currency, time zone, languages, default calling code and working days.
        Adding a country adds rows, never a table or a column (A8).
      responses:
        '200':
          description: Countries, ordered by code.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/reference/countries/{countryCode}/zones:
    parameters:
      - $ref: '#/components/parameters/CountryCode'
    get:
      tags: [reference]
      operationId: listZones
      summary: Zones of a country, one level at a time (A8)
      description: |
        Any signed-in person. Without `parentId`, the zones of level 1 (wilayas for Algeria); with `parentId`, its
        children (communes of a wilaya). With `q`, a search by name in every language across all levels, for a
        type-ahead field. Lists `VALIDATED` zones, plus the `PROVISIONAL` zones created by the organizations in the
        caller's perimeter. `DEACTIVATED` zones are never listed.
      parameters:
        - name: parentId
          in: query
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          description: Only this level (for example the attachment level, to pick the zone of an address).
          schema:
            type: integer
            minimum: 1
            maximum: 4
        - name: q
          in: query
          description: Part of a name, in any language.
          schema:
            type: string
            minLength: 2
            maxLength: 50
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: One page of zones, ordered by code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZonePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/reference/zones/{zoneId}:
    parameters:
      - $ref: '#/components/parameters/ZoneId'
    get:
      tags: [reference]
      operationId: getZone
      summary: One zone with its ancestors (A8)
      description: For example a commune with its wilaya, to show an address or pre-fill a filter.
      responses:
        '200':
          description: The zone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/zones/provisional:
    post:
      tags: [reference]
      operationId: createProvisionalZone
      summary: Create a provisional zone when the reference data lacks it (A8, criterion 3)
      description: |
        Requires `zone:create-provisional` on the organization. The zone is created at the attachment level of the
        organization's country, with status `PROVISIONAL`, under `parentId` when the upper level is loaded, or
        without parent when the country is not loaded at all. It can be used at once in addresses; the platform
        administrators later validate it or merge it into an official zone (sprint 2). Written to the audit log.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionalZoneRequest'
      responses:
        '201':
          description: Zone created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A zone with this name already exists under the same parent (`ZONE_NAME_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `ZONE_PARENT_LEVEL_INVALID` (the parent is not just above the attachment level),
            `ZONE_OUTSIDE_ORGANIZATION_COUNTRY`. A name missing in a language is filled from the others (M6);
            `ZONE_NAME_INVALID` when no name is given.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/permissions:
    get:
      tags: [access]
      operationId: listPermissions
      summary: Catalogue of permissions (C11, ADR-026)
      description: |
        Every permission the platform knows, with the scopes it applies to, whether it can be adjusted, and its
        label. The catalogue is defined by the code; which role or person holds which permission is data.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /v1/organizations:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: Organizations in my perimeter
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of organizations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Onboard a new client organization (C8, C12)
      description: |
        Requires `organization:create` on the platform (our team). Creates the organization in its country (M4,
        M5) and invites its first person with the `ORG_ADMIN` role, which has every permission on it, present and
        future (C8). The "set my password" link is sent to that person by e-mail (ADR-031). They then create the
        accounts of their own people and give them roles.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created and owner invited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          description: '`COUNTRY_UNKNOWN` (country not loaded in the reference data), `PHONE_INVALID`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [organizations]
      operationId: getOrganization
      summary: One organization
      responses:
        '200':
          description: The organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [organizations]
      operationId: updateOrganization
      summary: Update an organization's name and contact
      description: |
        Requires `organization:update` on the organization. The country and the type are not changed here: they
        drive the currency, hosting and addresses of every site (M4, M5); the platform back-office handles that
        case (sprint 2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'

  /v1/organizations/{organizationId}/sites:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [sites]
      operationId: listSites
      summary: Sites of an organization, within my perimeter (criterion 3, filters)
      description: |
        `zoneId` filters at any level of the zone tree: a wilaya gives every site of its communes, a commune only
        its own (A8).
      parameters:
        - name: zoneId
          in: query
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          description: Part of the site name.
          schema:
            type: string
            maxLength: 50
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of sites, ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitePage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sites]
      operationId: createSite
      summary: Create a site with its address (A1, A9, criterion 1)
      description: |
        Requires `site:create` on the organization. P1 accepts only `RESIDENTIAL` sites (A5). The site takes the
        organization's country; the address zone must be a zone of that country at its attachment level (a
        commune for Algeria), validated or provisional. An organization of type `RESIDENCE` has a single site.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteInput'
      responses:
        '201':
          description: Site created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            `SITE_TYPE_NOT_AVAILABLE` (A5), `ORGANIZATION_SINGLE_SITE` (type `RESIDENCE`), and the address codes
            of `AddressRejected`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: getSite
      summary: One site
      responses:
        '200':
          description: The site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [sites]
      operationId: updateSite
      summary: Update a site and its address (A9)
      description: |
        Requires `site:update` on the site; setting `active` to `false` also requires `site:archive` (never
        deleted, M2). A new address replaces the old one, which is kept in the history. **The buildings keep their
        own copy**: changing the site's address never changes a building's address (A9, decision of
        20 November 2026).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/AddressRejected'

  /v1/sites/{siteId}/buildings:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: listBuildings
      summary: Buildings of a site with their address (A2, A9, criterion 18)
      description: A person restricted to some buildings (C7) only sees those.
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
          description: Buildings, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Building'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [sites]
      operationId: createBuilding
      summary: Create a building (A2, A5, A9, criteria 1 and 18)
      description: |
        Requires `building:create` on the site. A villa is a building. P1 accepts only the `RESIDENTIAL` use.
        **Without `address`, the building receives a copy of the site's address** (`addressOrigin = SITE_COPY`);
        with `address`, it has its own (`OWN`, for example an entrance on another street). The copy is independent
        from then on: later changes of the site's address do not reach it.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingInput'
      responses:
        '201':
          description: Building created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another building of the site has this name (`BUILDING_NAME_TAKEN`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '`BUILDING_USE_NOT_AVAILABLE` (A5), and the address codes of `AddressRejected`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/buildings/{buildingId}:
    parameters:
      - $ref: '#/components/parameters/BuildingId'
    put:
      tags: [sites]
      operationId: updateBuilding
      summary: Update or archive a building, including its address (A9)
      description: |
        Requires `building:update` on its site; setting `active` to `false` also requires `building:archive`.
        Never deleted (M2). The address is always sent: an address different from the current one replaces it
        (kept in the history) and makes `addressOrigin` `OWN`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBuildingRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`VERSION_CONFLICT` or `BUILDING_NAME_TAKEN`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            `BUILDING_USE_NOT_AVAILABLE` (A5), `BUILDING_HAS_ACTIVE_UNITS` when archiving, and the address codes of
            `AddressRejected`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/sites/{siteId}/outdoor-areas:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [sites]
      operationId: listOutdoorAreas
      summary: Outdoor areas of a site (A3)
      parameters:
        - $ref: '#/components/parameters/IncludeInactive'
      responses:
        '200':
