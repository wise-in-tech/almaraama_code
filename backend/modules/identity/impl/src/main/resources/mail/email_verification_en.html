<!doctype html>
<html lang="en" dir="ltr">
<head><meta charset="utf-8"><title>Confirm your e-mail address</title></head>
<body style="margin:0;padding:24px;background:#f5f5f2;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#1f2a27">
<div style="max-width:560px;margin:0 auto;background:#ffffff;padding:24px;border-radius:8px" dir="ltr">
<p>Hello {{firstName}},</p>
<p>To confirm your e-mail address and activate your almaraama account, open this link:</p>
<p><a href="{{link}}" style="display:inline-block;padding:12px 20px;background:#0f5b4a;color:#ffffff;text-decoration:none;border-radius:6px">Confirm my address</a></p>
<p style="font-size:13px;color:#555555;word-break:break-all">{{link}}</p>
<p>The link is valid for {{validHours}} hours and works once.</p>
<p>If you did not create an account, ignore this message.</p>
<p style="font-size:12px;color:#777777">almaraama</p>
</div>
</body>
</html>
