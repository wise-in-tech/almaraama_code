<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>أكّد عنوان بريدك الإلكتروني</title></head>
<body style="margin:0;padding:24px;background:#f5f5f2;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#1f2a27">
<div style="max-width:560px;margin:0 auto;background:#ffffff;padding:24px;border-radius:8px" dir="rtl">
<p>مرحبًا {{firstName}}،</p>
<p>لتأكيد عنوان بريدك الإلكتروني وتفعيل حسابك في almaraama، افتح هذا الرابط:</p>
<p><a href="{{link}}" style="display:inline-block;padding:12px 20px;background:#0f5b4a;color:#ffffff;text-decoration:none;border-radius:6px">تأكيد عنواني</a></p>
<p style="font-size:13px;color:#555555;word-break:break-all">{{link}}</p>
<p>الرابط صالح لمدة {{validHours}} ساعة ويُستعمل مرة واحدة.</p>
<p>إذا لم تُنشئ حسابًا، تجاهل هذه الرسالة.</p>
<p style="font-size:12px;color:#777777">almaraama</p>
</div>
</body>
</html>
