<!doctype html>
<html lang="fr" dir="ltr">
<head><meta charset="utf-8"><title>Confirmez votre adresse e-mail</title></head>
<body style="margin:0;padding:24px;background:#f5f5f2;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#1f2a27">
<div style="max-width:560px;margin:0 auto;background:#ffffff;padding:24px;border-radius:8px" dir="ltr">
<p>Bonjour {{firstName}},</p>
<p>Pour confirmer votre adresse e-mail et activer votre compte almaraama, ouvrez ce lien :</p>
<p><a href="{{link}}" style="display:inline-block;padding:12px 20px;background:#0f5b4a;color:#ffffff;text-decoration:none;border-radius:6px">Confirmer mon adresse</a></p>
<p style="font-size:13px;color:#555555;word-break:break-all">{{link}}</p>
<p>Le lien est valable {{validHours}} heures et ne sert qu'une fois.</p>
<p>Si vous n'avez pas créé de compte, ignorez ce message.</p>
<p style="font-size:12px;color:#777777">almaraama</p>
</div>
</body>
</html>
